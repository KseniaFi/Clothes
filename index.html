<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай одежду по звуку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            color: #333;
            cursor: default;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            position: relative;
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
        }

        .game-info {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
        }

        .current-word {
            font-size: 28px;
            font-weight: bold;
            color: #d35400;
            text-shadow: 1px 1px 0 white;
            margin: 10px 0;
            min-height: 40px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 70vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .clothing-item {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.3s, filter 0.5s;
            width: 80px;
            height: 80px;
            transform-origin: center;
        }

        .clothing-item:hover {
            transform: scale(1.1);
        }

        .clothing-item.correct {
            animation: correctGlow 1.5s forwards;
        }

        .clothing-item.incorrect {
            animation: incorrectGlow 1.5s forwards;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        @keyframes correctGlow {
            0% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
            }
            50% {
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00);
            }
            100% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
                opacity: 1;
            }
        }

        @keyframes incorrectGlow {
            0% {
                filter: drop-shadow(0 0 5px #ff0000) drop-shadow(0 0 10px #ff0000);
            }
            50% {
                filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 30px #ff0000);
            }
            100% {
                filter: drop-shadow(0 0 5px #ff0000) drop-shadow(0 0 10px #ff0000);
                opacity: 1;
            }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .game-area {
                height: 60vh;
            }
            
            .clothing-item {
                width: 60px;
                height: 60px;
            }
            
            .current-word {
                font-size: 24px;
            }
            
            .score {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .game-area {
                height: 50vh;
            }
            
            .clothing-item {
                width: 50px;
                height: 50px;
            }
            
            .current-word {
                font-size: 20px;
            }
            
            .score {
                font-size: 18px;
            }
        }
    </style>
</head>

        // State variables
        let currentTargetItem = null;
        let score = 0;
        let activeItems = [];
        let backgroundMusic = null;
        let pronunciationAudio = null;
        let fireworksInterval = null;

        // DOM elements
        const gameArea = document.getElementById('gameArea');
        const currentWord = document.getElementById('currentWord');
        const scoreDisplay = document.getElementById('score');
        const speaker = document.getElementById('speaker');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');

        // Initialize
        function init() {
            // Start the game
            startGame();
            
            // Event handlers
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            
            // Start fireworks
            startFireworks();
        }

        // Start the game
        function startGame() {
            // Start generating flying clothing items
            setInterval(createFlyingItem, 1000);
            
            // Start playing random audio words
            playRandomWord();
        }

        // Create a flying clothing item
        function createFlyingItem() {
            // Select a random clothing item
            const randomIndex = Math.floor(Math.random() * clothingItems.length);
            const item = clothingItems[randomIndex];
            
            // Create the element
            const itemElement = document.createElement('div');
            itemElement.className = 'clothing-item';
            itemElement.style.backgroundImage = `url('${item.image}')`;
            
            // Set random position at the bottom
            const leftPosition = Math.random() * (gameArea.offsetWidth - 80);
            itemElement.style.left = `${leftPosition}px`;
            itemElement.style.bottom = '-80px';
            
            // Set random animation duration
            const duration = 10 + Math.random() * 10;
            itemElement.style.animation = `flyUp ${duration}s linear forwards`;
            
            // Add click event
            itemElement.addEventListener('click', () => handleItemClick(itemElement, item));
            
            // Store reference
            itemElement.dataset.itemName = item.name;
            
            // Add to game area and active items
            gameArea.appendChild(itemElement);
            activeItems.push({
                element: itemElement,
                name: item.name
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (itemElement.parentNode) {
                    gameArea.removeChild(itemElement);
                    activeItems = activeItems.filter(activeItem => activeItem.element !== itemElement);
                }
            }, duration * 1000);
        }

        // Handle click on clothing item
        function handleItemClick(itemElement, item) {
            // Check if this is the correct item
            if (currentTargetItem && item.name === currentTargetItem.name) {
                // Correct answer
                itemElement.classList.add('correct');
                score++;
                scoreDisplay.textContent = `Счёт: ${score}`;
                
                // Remove item after animation
                setTimeout(() => {
                    if (itemElement.parentNode) {
                        gameArea.removeChild(itemElement);
                        activeItems = activeItems.filter(activeItem => activeItem.element !== itemElement);
                    }
                }, 1500);
                
                // Play next word after a short delay
                setTimeout(playRandomWord, 1000);
            } else {
                // Incorrect answer
                itemElement.classList.add('incorrect');
                
                // Remove the class after animation
                setTimeout(() => {
                    itemElement.classList.remove('incorrect');
                }, 1500);
            }
        }

        // Play a random word
        function playRandomWord() {
            // Select a random clothing item
            const randomIndex = Math.floor(Math.random() * clothingItems.length);
            currentTargetItem = clothingItems[randomIndex];
            
            // Update the display
            currentWord.textContent = `Слушайте: ${currentTargetItem.name}`;
            
            // Play pronunciation with higher volume
            playPronunciation(currentTargetItem.audio);
        }

        // Play pronunciation with higher volume
        function playPronunciation(audioUrl) {
            // Stop previous pronunciation if playing
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Create new audio element with higher volume
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = Math.min(volumeSlider.value * 1.5, 1.0); // 50% louder than background music
            
            pronunciationAudio.play();
        }

        // Start fireworks animation
        function startFireworks() {
            fireworksInterval = setInterval(createFirework, 300);
        }

        // Create a firework
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // Random position
            const left = Math.random() * gameArea.offsetWidth;
            const top = Math.random() * gameArea.offsetHeight;
            firework.style.left = `${left}px`;
            firework.style.top = `${top}px`;
            
            // Random color
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            firework.style.backgroundColor = color;
            
            // Random size
            const size = 4 + Math.random() * 8;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            // Add to game area
            gameArea.appendChild(firework);
            
            // Remove after animation
            setTimeout(() => {
                if (firework.parentNode) {
                    gameArea.removeChild(firework);
                }
            }, 2000);
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Create and play background music
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Add playing class to speaker for animation
                speaker.classList.add('playing');
                
                // Show volume control
                volumeControl.classList.add('show');
            } else {
                // Stop music
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Remove playing class from speaker
                speaker.classList.remove('playing');
                
                // Hide volume control
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
