<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одень девушку - Изучение английской одежды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .speaker-container {
            position: relative;
            margin-bottom: 10px;
            text-align: center;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .speaker:hover {
            transform: scale(1.1);
        }

        .volume-control {
            margin-top: 5px;
            display: none;
            width: 150px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }

        .girl-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: auto;
            margin: 10px 0;
            z-index: 1;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .girl-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .clothing-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            pointer-events: all;
        }

        .clothing-item.on-girl {
            z-index: 3;
            transition: none;
        }

        .clothing-item.moving-to-girl {
            z-index: 100;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .clothing-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(20px, 5vw, 32px);
            font-weight: bold;
            text-align: center;
            padding: 15px 30px;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            text-shadow: 2px 2px 0 #d63031, -2px -2px 0 #d63031, 2px -2px 0 #d63031, -2px 2px 0 #d63031;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 90vw;
            word-wrap: break-word;
        }

        .clothing-name.show {
            opacity: 1;
        }

        .clothes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-top: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .clothes-grid .clothing-item {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto;
            transition: transform 0.3s;
        }

        .clothes-grid img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .clothes-grid .clothing-item:hover img {
            transform: scale(1.1);
        }

        /* Адаптация для мобильных устройств */
        @media (max-width: 768px) {
            .girl-container {
                width: 95vw;
                max-width: 350px;
            }
            
            .clothes-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 8px;
                padding: 10px;
            }
            
            .clothes-grid .clothing-item {
                width: 60px;
                height: 60px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .volume-control {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            .clothes-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 6px;
            }
            
            .clothes-grid .clothing-item {
                width: 50px;
                height: 50px;
            }
            
            .girl-container {
                width: 98vw;
                max-width: 300px;
            }
        }

        /* Для очень больших экранов */
        @media (min-width: 1200px) {
            .girl-container {
                max-width: 450px;
            }
            
            .clothes-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 15px;
            }
            
            .clothes-grid .clothing-item {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

                category: 'shoes'
            },
            { 
                id: 'heeled-over-the-knee-boots', 
                name: 'Heeled over-the-knee boots', 
                type: 'double',
                audio: 'videos/J-20251125184613900Z.mp3',
                items: [
                    {
                        image: 'videos/IMG_20251125_222515_088(1).png',
                        position: { left: '27%', top: '47%', width: '10%', rotation: '0deg' }
                    },
                    {
                        image: 'videos/IMG_20251125_222515_088.png',
                        position: { left: '63%', top: '47%', width: '10%', rotation: '0deg' }
                    }
                ],
                category: 'shoes'
            },
            { 
                id: 'heeled-ankle-boots', 
                name: 'Heeled ankle boots', 
                image: 'videos/IMG_20251123_163324_828.png', 
                audio: 'videos/J-20251125183935749Z.mp3',
                position: { left: '28%', top: '74%', width: '44%', rotation: '0deg' },
                type: 'single',
                category: 'shoes'
            },
            { 
                id: 'fluffy-slippers', 
                name: 'Fluffy slippers', 
                type: 'double',
                audio: 'videos/J-20251125184120836Z.mp3',
                items: [
                    {
                        image: 'videos/1763743348(1).png',
                        position: { left: '27%', top: '74%', width: '10%', rotation: '0deg' }
                    },
                    {
                        image: 'videos/1763743348.png',
                        position: { left: '63%', top: '74%', width: '10%', rotation: '0deg' }
                    }
                ],
                category: 'shoes'
            }
        ];

        // Переменные для состояния игры
        let backgroundMusic = null;
        let isMusicPlaying = false;
        const girlContainer = document.getElementById('girlContainer');
        const clothesGrid = document.getElementById('clothesGrid');
        const clothingName = document.getElementById('clothingName');
        const speaker = document.getElementById('speaker');
        const volumeControl = document.getElementById('volumeControl');

        // Карта z-index для разных категорий одежды
        const zIndexMap = {
            'hat': 100,
            'top': 80,
            'bottom': 70,
            'socks': 60,
            'shoes': 50,
            'accessory': 90
        };

        // Инициализация игры
        function initGame() {
            // Создаем элементы одежды в сетке
            clothingItems.forEach(item => {
                const clothingElement = document.createElement('div');
                clothingElement.className = 'clothing-item';
                clothingElement.dataset.id = item.id;
                clothingElement.dataset.type = item.type;
                
                const img = document.createElement('img');
                // Для двойных предметов используем первое изображение в качестве превью
                if (item.type === 'double') {
                    img.src = item.items[0].image;
                } else {
                    img.src = item.image;
                }
                img.alt = item.name;
                
                clothingElement.appendChild(img);
                clothesGrid.appendChild(clothingElement);
                
                // Добавляем обработчик клика
                clothingElement.addEventListener('click', () => handleClothingClick(item, clothingElement));
            });
            
            // Настройка аудио колонки
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeControl.addEventListener('input', updateVolume);
        }

        // Обработчик клика на предмет одежды
        function handleClothingClick(item, element) {
            // Воспроизводим аудио с произношением
            playAudio(item.audio);
            
            // Показываем название предмета
            showClothingName(item.name);
            
            // Анимируем перемещение одежды на девушку
            if (item.type === 'double') {
                animateDoubleClothingToGirl(item, element);
            } else {
                animateClothingToGirl(item, element);
            }
        }

        // Воспроизведение аудио
        function playAudio(audioSrc) {
            const audio = new Audio(audioSrc);
            audio.play();
        }

        // Показать название предмета одежды
        function showClothingName(name) {
            clothingName.textContent = name;
            clothingName.classList.add('show');
            
            setTimeout(() => {
                clothingName.classList.remove('show');
            }, 5000);
        }

        // Анимированное перемещение одиночной одежды на девушку
        function animateClothingToGirl(item, element) {
            // Получаем текущую позицию элемента
            const rect = element.getBoundingClientRect();
            const girlRect = girlContainer.getBoundingClientRect();
            
            // Создаем клон элемента для анимации
            const clone = element.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.left = `${rect.left}px`;
            clone.style.top = `${rect.top}px`;
            clone.style.width = `${rect.width}px`;
            clone.style.height = `${rect.height}px`;
            clone.style.zIndex = '1000';
            clone.classList.add('moving-to-girl');
            document.body.appendChild(clone);
            
            // Вычисляем конечную позицию на девушке
            const finalLeft = girlRect.left + (girlRect.width * parseFloat(item.position.left) / 100);
            const finalTop = girlRect.top + (girlRect.height * parseFloat(item.position.top) / 100);
            const finalWidth = girlRect.width * parseFloat(item.position.width) / 100;
            
            // Анимируем перемещение
            setTimeout(() => {
                clone.style.left = `${finalLeft}px`;
                clone.style.top = `${finalTop}px`;
                clone.style.width = `${finalWidth}px`;
                clone.style.height = 'auto';
                
                // После завершения анимации
                setTimeout(() => {
                    // Удаляем клон
                    clone.remove();
                    
                    // Удаляем исходный элемент из сетки
                    element.remove();
                    
                    // Создаем новый элемент для девушки
                    moveClothingToGirl(item);
                }, 700);
            }, 50);
        }

        // Анимированное перемещение двойной одежды (обуви и носков) на девушку
        function animateDoubleClothingToGirl(item, element) {
            // Получаем текущую позицию элемента
            const rect = element.getBoundingClientRect();
            const girlRect = girlContainer.getBoundingClientRect();
            
            // Создаем клоны для обеих частей
            const clones = [];
            
            item.items.forEach((shoe, index) => {
                const clone = document.createElement('div');
                clone.className = 'clothing-item moving-to-girl';
                clone.style.position = 'fixed';
                clone.style.left = `${rect.left}px`;
                clone.style.top = `${rect.top}px`;
                clone.style.width = `${rect.width}px`;
                clone.style.height = `${rect.height}px`;
                clone.style.zIndex = '1000';
                
                const img = document.createElement('img');
                img.src = shoe.image;
                img.alt = item.name;
                clone.appendChild(img);
                
                document.body.appendChild(clone);
                clones.push(clone);
                
                // Вычисляем конечную позицию на девушке
                const finalLeft = girlRect.left + (girlRect.width * parseFloat(shoe.position.left) / 100);
                const finalTop = girlRect.top + (girlRect.height * parseFloat(shoe.position.top) / 100);
                const finalWidth = girlRect.width * parseFloat(shoe.position.width) / 100;
                
                // Анимируем перемещение
                setTimeout(() => {
                    clone.style.left = `${finalLeft}px`;
                    clone.style.top = `${finalTop}px`;
                    clone.style.width = `${finalWidth}px`;
                    clone.style.height = 'auto';
                }, 50);
            });
            
            // После завершения анимации
            setTimeout(() => {
                // Удаляем клоны
                clones.forEach(clone => clone.remove());
                
                // Удаляем исходный элемент из сетки
                element.remove();
                
                // Создаем новые элементы для девушки
                moveDoubleClothingToGirl(item);
            }, 700);
        }

        // Перемещение одиночной одежды на девушку
        function moveClothingToGirl(item) {
            // Создаем новый элемент для девушки
            const clothingOnGirl = document.createElement('div');
            clothingOnGirl.className = 'clothing-item on-girl';
            clothingOnGirl.dataset.id = item.id;
            clothingOnGirl.dataset.type = item.type;
            
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.name;
            
            // Устанавливаем позицию на девушке
            clothingOnGirl.style.left = item.position.left;
            clothingOnGirl.style.top = item.position.top;
            clothingOnGirl.style.width = item.position.width;
            
            // Устанавливаем z-index в зависимости от категории
            if (item.category && zIndexMap[item.category]) {
                clothingOnGirl.style.zIndex = zIndexMap[item.category];
            }
            
            clothingOnGirl.appendChild(img);
            girlContainer.appendChild(clothingOnGirl);
            
            // Добавляем обработчик для снятия одежды
            clothingOnGirl.addEventListener('click', () => removeClothingFromGirl(item, clothingOnGirl));
        }

        // Перемещение двойной одежды на девушку
        function moveDoubleClothingToGirl(item) {
            item.items.forEach((shoe, index) => {
                const clothingOnGirl = document.createElement('div');
                clothingOnGirl.className = 'clothing-item on-girl';
                clothingOnGirl.dataset.id = item.id;
                clothingOnGirl.dataset.type = item.type;
                clothingOnGirl.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = shoe.image;
                img.alt = item.name;
                
                // Устанавливаем позицию на девушке
                clothingOnGirl.style.left = shoe.position.left;
                clothingOnGirl.style.top = shoe.position.top;
                clothingOnGirl.style.width = shoe.position.width;
                
                // Устанавливаем z-index в зависимости от категории
                if (item.category && zIndexMap[item.category]) {
                    clothingOnGirl.style.zIndex = zIndexMap[item.category];
                }
                
                clothingOnGirl.appendChild(img);
                girlContainer.appendChild(clothingOnGirl);
                
                // Добавляем обработчик для снятия одежды
                clothingOnGirl.addEventListener('click', () => removeDoubleClothingFromGirl(item, clothingOnGirl));
            });
        }

        // Снятие одиночной одежды с девушки
        function removeClothingFromGirl(item, element) {
            // Получаем текущую позицию элемента на девушке
            const rect = element.getBoundingClientRect();
            const girlRect = girlContainer.getBoundingClientRect();
            
            // Создаем клон для анимации
            const clone = element.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.left = `${rect.left}px`;
            clone.style.top = `${rect.top}px`;
            clone.style.width = `${rect.width}px`;
            clone.style.height = `${rect.height}px`;
            clone.style.zIndex = '1000';
            clone.classList.add('moving-to-girl');
            document.body.appendChild(clone);
            
            // Удаляем элемент с девушки
            element.remove();
            
            // Находим позицию в сетке для этого элемента
            const gridItems = Array.from(clothesGrid.querySelectorAll('.clothing-item'));
            const targetIndex = clothingItems.findIndex(clothing => clothing.id === item.id);
            const targetCell = clothesGrid.children[targetIndex % clothesGrid.children.length];
            const targetRect = targetCell.getBoundingClientRect();
            
            // Анимируем перемещение обратно в сетку
            setTimeout(() => {
                clone.style.left = `${targetRect.left}px`;
                clone.style.top = `${targetRect.top}px`;
                clone.style.width = `${targetRect.width}px`;
                clone.style.height = `${targetRect.height}px`;
                
                // После завершения анимации
                setTimeout(() => {
                    // Удаляем клон
                    clone.remove();
                    
                    // Возвращаем элемент в сетку
                    const clothingElement = document.createElement('div');
                    clothingElement.className = 'clothing-item';
                    clothingElement.dataset.id = item.id;
                    clothingElement.dataset.type = item.type;
                    
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    
                    clothingElement.appendChild(img);
                    clothesGrid.appendChild(clothingElement);
                    
                    // Добавляем обработчик клика
                    clothingElement.addEventListener('click', () => handleClothingClick(item, clothingElement));
                }, 700);
            }, 50);
        }

        // Снятие двойной одежды с девушки
        function removeDoubleClothingFromGirl(item, element) {
            // Находим все элементы этой пары на девушке
            const elementsOnGirl = girlContainer.querySelectorAll(`.clothing-item.on-girl[data-id="${item.id}"]`);
            
            // Получаем позицию кликнутого элемента
            const rect = element.getBoundingClientRect();
            const girlRect = girlContainer.getBoundingClientRect();
            
            // Удаляем все элементы этой пары с девушки
            elementsOnGirl.forEach(el => el.remove());
            
            // Создаем клоны для анимации
            const clones = [];
            elementsOnGirl.forEach((el, index) => {
                const clone = el.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.left = `${rect.left}px`;
                clone.style.top = `${rect.top}px`;
                clone.style.width = `${rect.width}px`;
                clone.style.height = `${rect.height}px`;
                clone.style.zIndex = '1000';
                clone.classList.add('moving-to-girl');
                document.body.appendChild(clone);
                clones.push(clone);
            });
            
            // Находим позицию в сетке для этого элемента
            const gridItems = Array.from(clothesGrid.querySelectorAll('.clothing-item'));
            const targetIndex = clothingItems.findIndex(clothing => clothing.id === item.id);
            const targetCell = clothesGrid.children[targetIndex % clothesGrid.children.length];
            const targetRect = targetCell.getBoundingClientRect();
            
            // Анимируем перемещение обратно в сетку
            setTimeout(() => {
                clones.forEach(clone => {
                    clone.style.left = `${targetRect.left}px`;
                    clone.style.top = `${targetRect.top}px`;
                    clone.style.width = `${targetRect.width}px`;
                    clone.style.height = `${targetRect.height}px`;
                });
                
                // После завершения анимации
                setTimeout(() => {
                    // Удаляем клоны
                    clones.forEach(clone => clone.remove());
                    
                    // Возвращаем элемент в сетку
                    const clothingElement = document.createElement('div');
                    clothingElement.className = 'clothing-item';
                    clothingElement.dataset.id = item.id;
                    clothingElement.dataset.type = item.type;
                    
                    const img = document.createElement('img');
                    // Используем первое изображение в качестве превью
                    img.src = item.items[0].image;
                    img.alt = item.name;
                    
                    clothingElement.appendChild(img);
                    clothesGrid.appendChild(clothingElement);
                    
                    // Добавляем обработчик клика
                    clothingElement.addEventListener('click', () => handleClothingClick(item, clothingElement));
                }, 700);
            }, 50);
        }

        // Управление фоновой музыкой
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeControl.value;
            }
            
            if (isMusicPlaying) {
                backgroundMusic.pause();
                volumeControl.style.display = 'none';
            } else {
                backgroundMusic.play();
                volumeControl.style.display = 'block';
            }
            
            isMusicPlaying = !isMusicPlaying;
            speaker.style.opacity = isMusicPlaying ? '1' : '0.7';
        }

        // Обновление громкости
        function updateVolume() {
            if (backgroundMusic) {
                backgroundMusic.volume = volumeControl.value;
            }
        }

        // Запуск игры при загрузке страницы
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
