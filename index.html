<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Audio Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР С ПРОКРУТКОЙ ДЛЯ ВСЕГО ПРОЕКТА */
        .main-container {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Стили для основного скроллбара */
        .main-container::-webkit-scrollbar {
            width: 14px;
        }

        .main-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .main-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        .main-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.6);
            background-clip: content-box;
        }

        /* Для Firefox */
        .main-container {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.4) rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            cursor: default;
            /* Убираем overflow: hidden чтобы основной контейнер мог скроллиться */
            overflow: visible;
        }

        /* АДАПТАЦИЯ ДЛЯ КОМПЬЮТЕРОВ */
        @media (min-width: 1024px) {
            body {
                justify-content: center;
                padding: 20px;
            }
            
            .main-container {
                width: 100%;
                height: 100vh;
                padding-right: 15px; /* Компенсация для скроллбара */
            }
            
            .game-container {
                margin-top: 20px;
                max-width: 1400px;
                width: 95%;
                padding-bottom: 50px; /* Отступ снизу для скролла */
            }
            
            .game-area {
                height: 75vh;
                max-height: 750px;
            }
            
            .clothing-item {
                width: 130px;
                height: 130px;
            }
            
            .flying-items-container {
                overflow: auto;
            }
            
            /* Увеличиваем игровую область для большего количества предметов */
            .flying-items-container {
                min-height: 600px;
            }
            
            .score {
                font-size: 32px;
            }
            
            .video-container {
                width: 150px;
                height: 225px;
            }
            
            .game-info {
                padding: 25px;
                max-width: 800px;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 18px;
            }
            
            .item-name-feedback {
                font-size: 42px;
                padding: 20px 30px;
            }
            
            .correct-feedback-item {
                width: 200px;
                height: 200px;
            }
            
            .correct-feedback-item.large {
                width: 250px;
                height: 250px;
            }
            
            .audio-control {
                top: 20px;
                right: 35px; /* Сдвигаем вправо чтобы не перекрывалось скроллбаром */
            }
            
            .clothing-audio-control {
                top: 20px;
            }
            
            .speaker {
                width: 70px;
                height: 70px;
            }
            
            .clothing-speaker {
                width: 100px;
                height: 100px;
            }
            
            /* Убираем overflow: hidden с body на компьютерах */
            body {
                overflow: visible;
            }
        }

        /* Для очень больших экранов */
        @media (min-width: 1600px) {
            .game-area {
                height: 80vh;
                max-height: 850px;
            }
            
            .clothing-item {
                width: 150px;
                height: 150px;
            }
            
            .score {
                font-size: 36px;
            }
            
            .video-container {
                width: 180px;
                height: 270px;
            }
        }

        /* СТАНДАРТНЫЕ СТИЛИ (как были) */
        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .clothing-audio-control {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .clothing-speaker {
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }

        .clothing-speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .clothing-speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 100px;
        }

        .game-info {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
        }

        .score-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2, 0 0 30px #8a2be2;
            animation: scoreGlow 2s infinite alternate;
        }

        .video-container {
            width: 120px;
            height: 180px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 16px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-restart {
            background: #e74c3c;
        }

        .btn-restart:hover {
            background: #c0392b;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 70vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        /* КОНТЕЙНЕР С ПРОКРУТКОЙ ДЛЯ ЛЕТАЮЩИХ ВЕЩЕЙ */
        .flying-items-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Добавляем прокрутку */
            z-index: 1;
        }

        /* Стили для скроллбара летающих вещей */
        .flying-items-container::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .flying-items-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .flying-items-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .flying-items-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .flying-items-container::-webkit-scrollbar-corner {
            background: transparent;
        }

        .clothing-item {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.3s, filter 0.5s;
            width: 100px;
            height: 100px;
            transform-origin: center;
            z-index: 10;
        }

        .clothing-item:hover {
            transform: scale(1.1);
        }

        .clothing-item.correct {
            animation: correctGlow 1.5s forwards;
        }

        .clothing-item.incorrect {
            animation: incorrectGlow 1.5s forwards;
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('videos/IMG_20251128_230412_184.jpg') no-repeat center center;
            background-size: cover;
            z-index: 25;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
            pointer-events: none; /* Чтобы не мешал прокрутке когда невидим */
        }

        .feedback-overlay.active {
            pointer-events: auto; /* Включаем взаимодействие когда оверлей виден */
        }

        .correct-feedback {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 30;
            margin-bottom: 30px;
        }

        .correct-feedback-item {
            width: 180px;
            height: 180px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: correctFeedbackGlow 2s ease-in-out, float 2s ease-in-out infinite;
        }

        .correct-feedback-item.large {
            width: 220px;
            height: 220px;
        }

        .item-name-feedback {
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
            animation: textGlow 2s infinite alternate;
            text-align: center;
            padding: 15px 25px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            max-width: 90%;
            line-height: 1.4;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes flyAround {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20vw, 15vh) rotate(90deg);
            }
            50% {
                transform: translate(-15vw, 25vh) rotate(180deg);
            }
            75% {
                transform: translate(10vw, -10vh) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        @keyframes correctGlow {
            0% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
            }
            50% {
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00);
            }
            100% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
                opacity: 1;
            }
        }

        @keyframes incorrectGlow {
            0% {
                filter: drop-shadow(0 0 5px #ff0000) drop-shadow(0 0 10px #ff0000);
            }
            50% {
                filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 30px #ff0000);
            }
            100% {
                filter: drop-shadow(0 0 5px #ff0000) drop-shadow(0 0 10px #ff0000);
                opacity: 1;
            }
        }

        @keyframes correctFeedbackGlow {
            0% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px #00ff00) drop-shadow(0 0 40px #00ff00);
                transform: scale(1.2);
            }
            100% {
                filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 10px #00ff00);
                transform: scale(1);
            }
        }

        @keyframes scoreGlow {
            0% {
                text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2, 0 0 30px #8a2be2;
            }
            100% {
                text-shadow: 0 0 15px #8a2be2, 0 0 25px #8a2be2, 0 0 35px #8a2be2;
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
            }
            100% {
                text-shadow: 0 0 15px #00ff00, 0 0 25px #00ff00, 0 0 35px #00ff00;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile-first responsive design */
        @media (max-width: 1023px) {
            /* На мобильных устройствах убираем основной скроллбар */
            .main-container {
                overflow: visible;
                height: auto;
            }
            
            body {
                padding: 10px;
                overflow-x: hidden;
            }
            
            .game-container {
                margin-top: 100px;
            }
        }

        @media (max-width: 768px) {
            .game-area {
                height: 60vh;
            }
            
            .clothing-item {
                width: 80px;
                height: 80px;
            }
            
            .score {
                font-size: 20px;
            }
            
            .video-container {
                width: 90px;
                height: 135px;
            }
            
            .correct-feedback-item {
                width: 130px;
                height: 130px;
            }
            
            .correct-feedback-item.large {
                width: 160px;
                height: 160px;
            }
            
            .item-name-feedback {
                font-size: 28px;
                padding: 12px 20px;
            }
            
            .clothing-speaker {
                width: 70px;
                height: 70px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            /* Адаптивные скроллбары для мобильных */
            .flying-items-container::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
        }

        @media (max-width: 480px) {
            .game-area {
                height: 50vh;
            }
            
            .clothing-item {
                width: 70px;
                height: 70px;
            }
            
            .score {
                font-size: 18px;
            }
            
            .video-container {
                width: 70px;
                height: 105px;
            }
            
            .correct-feedback-item {
                width: 100px;
                height: 100px;
            }
            
            .correct-feedback-item.large {
                width: 130px;
                height: 130px;
            }
            
            .item-name-feedback {
                font-size: 24px;
                padding: 10px 16px;
            }
            
            .clothing-speaker {
                width: 60px;
                height: 60px;
            }
            
            .btn {
                padding: 5px 10px;
                font-size: 12px;
            }
            
            .game-container {
                margin-top: 80px;
            }
        }

        @media (max-width: 360px) {
            .game-area {
                height: 45vh;
            }
            
            .clothing-item {
                width: 60px;
                height: 60px;
            }
            
            .score {
                font-size: 16px;
            }
            
            .video-container {
                width: 60px;
                height: 90px;
            }
            
            .correct-feedback-item {
                width: 80px;
                height: 80px;
            }
            
            .correct-feedback-item.large {
                width: 100px;
                height: 100px;
            }
            
            .item-name-feedback {
                font-size: 20px;
                padding: 8px 14px;
            }
            
            .clothing-speaker {
                width: 50px;
                height: 50px;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

    </div>

        // State variables
        let currentItemIndex = 0;
        let score = 0;
        let activeItems = [];
        let backgroundMusic = null;
        let clothingAudio = null;
        let fireworksInterval = null;
        let isWaitingForAnswer = false;
        let isPausedForFeedback = false;
        let preloadedImages = {};

        // DOM elements
        const mainContainer = document.getElementById('mainContainer');
        const gameArea = document.getElementById('gameArea');
        const flyingItemsContainer = document.getElementById('flyingItemsContainer');
        const scoreDisplay = document.getElementById('score');
        const speaker = document.getElementById('speaker');
        const clothingSpeaker = document.getElementById('clothingSpeaker');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const correctFeedback = document.getElementById('correctFeedback');
        const itemNameFeedback = document.getElementById('itemNameFeedback');
        const restartBtn = document.getElementById('restartBtn');

        // Preload images for better performance
        function preloadImages() {
            clothingItems.forEach(item => {
                if (item.isPair) {
                    preloadImage(item.images.left);
                    preloadImage(item.images.right);
                } else {
                    preloadImage(item.image);
                }
            });
        }

        function preloadImage(src) {
            if (!preloadedImages[src]) {
                const img = new Image();
                img.src = src;
                preloadedImages[src] = img;
            }
        }

        // Initialize
        function init() {
            preloadImages();
            startGame();
            
            speaker.addEventListener('click', toggleBackgroundMusic);
            clothingSpeaker.addEventListener('click', startNextWord);
            volumeSlider.addEventListener('input', adjustVolume);
            restartBtn.addEventListener('click', restartGame);
            
            startFireworks();
            
            // Адаптация для больших экранов при загрузке
            handleLargeScreenLayout();
            
            // Обработчик изменения размера окна
            window.addEventListener('resize', handleLargeScreenLayout);
            
            // Прокрутка к началу при загрузке
            setTimeout(() => {
                mainContainer.scrollTop = 0;
            }, 100);
        }

        // Обработка макета для больших экранов
        function handleLargeScreenLayout() {
            const isLargeScreen = window.innerWidth >= 1024;
            
            if (isLargeScreen && flyingItemsContainer.children.length > 0) {
                // Для больших экранов пересчитываем позиции с большим пространством
                const positions = generateEvenPositionsForLargeScreen(clothingItems.length);
                
                // Обновляем позиции всех активных элементов
                activeItems.forEach((item, index) => {
                    if (index < positions.length) {
                        const position = positions[index];
                        item.element.style.left = `${position.x}px`;
                        item.element.style.top = `${position.y}px`;
                    }
                });
            }
        }

        // Генерация позиций для больших экранов
        function generateEvenPositionsForLargeScreen(count) {
            const positions = [];
            const rows = Math.ceil(Math.sqrt(count * 0.7)); // Меньше рядов для большего пространства
            const cols = Math.ceil(count / rows);
            
            // Используем больший контейнер для больших экранов
            const containerWidth = flyingItemsContainer.scrollWidth || gameArea.offsetWidth;
            const containerHeight = flyingItemsContainer.scrollHeight || gameArea.offsetHeight;
            
            const areaWidth = containerWidth - 180; // Больше места по краям
            const areaHeight = containerHeight - 180;
            
            for (let i = 0; i < count; i++) {
                const row = Math.floor(i / cols);
                const col = i % cols;
                
                const x = (col * areaWidth / (cols - 1)) + 90;
                const y = (row * areaHeight / (rows - 1)) + 90;
                
                positions.push({ x, y });
            }
            
            return positions;
        }

        // Start the game
        function startGame() {
            createAllFlyingItems();
            startNextWord();
        }

        // Restart the game
        function restartGame() {
            currentItemIndex = 0;
            score = 0;
            activeItems = [];
            scoreDisplay.textContent = `Score: ${score}`;
            
            clearFlyingItems();
            feedbackOverlay.style.display = 'none';
            feedbackOverlay.classList.remove('active');
            
            // Прокрутка к началу при рестарте
            mainContainer.scrollTop = 0;
            
            startGame();
        }

        // Create all flying clothing items
        function createAllFlyingItems() {
            clearFlyingItems();
            
            // Выбираем стратегию позиционирования в зависимости от размера экрана
            const isLargeScreen = window.innerWidth >= 1024;
            const positions = isLargeScreen 
                ? generateEvenPositionsForLargeScreen(clothingItems.length)
                : generateEvenPositions(clothingItems.length);
            
            for (let i = 0; i < clothingItems.length; i++) {
                const item = clothingItems[i];
                const position = positions[i];
                
                createFlyingItem(item, position.x, position.y);
            }
        }

        // Generate evenly distributed positions (оригинальная версия для мобильных)
        function generateEvenPositions(count) {
            const positions = [];
            const rows = Math.ceil(Math.sqrt(count));
            const cols = Math.ceil(count / rows);
            
            const areaWidth = flyingItemsContainer.scrollWidth - 120;
            const areaHeight = flyingItemsContainer.scrollHeight - 120;
            
            for (let i = 0; i < count; i++) {
                const row = Math.floor(i / cols);
                const col = i % cols;
                
                const x = (col * areaWidth / (cols - 1)) + 60;
                const y = (row * areaHeight / (rows - 1)) + 60;
                
                positions.push({ x, y });
            }
            
            return positions;
        }

        // Create a flying clothing item
        function createFlyingItem(item, x, y) {
            const itemElement = document.createElement('div');
            itemElement.className = 'clothing-item';
            
            if (item.isPair) {
                itemElement.style.backgroundImage = `url('${item.images.left}')`;
            } else {
                itemElement.style.backgroundImage = `url('${item.image}')`;
            }
            
            itemElement.style.left = `${x}px`;
            itemElement.style.top = `${y}px`;
            
            const duration = 15 + Math.random() * 10;
            itemElement.style.animation = `flyAround ${duration}s linear infinite`;
            
            itemElement.addEventListener('click', () => handleItemClick(itemElement, item));
            itemElement.dataset.itemName = item.name;
            
            flyingItemsContainer.appendChild(itemElement);
            activeItems.push({
                element: itemElement,
                name: item.name
            });
        }

        // Handle click on clothing item
        function handleItemClick(itemElement, item) {
            if (!isWaitingForAnswer || isPausedForFeedback) return;
            
            if (item.name === clothingItems[currentItemIndex].name) {
                itemElement.classList.add('correct');
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                
                isPausedForFeedback = true;
                showCorrectFeedback(item);
                
                setTimeout(() => {
                    itemElement.remove();
                    activeItems = activeItems.filter(activeItem => activeItem.element !== itemElement);
                    
                    setTimeout(() => {
                        currentItemIndex++;
                        if (currentItemIndex < clothingItems.length) {
                            startNextWord();
                        } else {
                            setTimeout(() => {
                                alert("Congratulations! You've completed the game!");
                            }, 500);
                        }
                        isPausedForFeedback = false;
                    }, 500);
                }, 2500);
            } else {
                itemElement.classList.add('incorrect');
                
                setTimeout(() => {
                    itemElement.classList.remove('incorrect');
                }, 1500);
            }
        }

        // Show correct feedback with overlay
        function showCorrectFeedback(item) {
            correctFeedback.innerHTML = '';
            itemNameFeedback.textContent = item.name;
            
            if (item.isPair) {
                const leftItem = document.createElement('div');
                leftItem.className = 'correct-feedback-item';
                if (item.largeSize) leftItem.classList.add('large');
                leftItem.style.backgroundImage = `url('${item.images.left}')`;
                
                const rightItem = document.createElement('div');
                rightItem.className = 'correct-feedback-item';
                if (item.largeSize) rightItem.classList.add('large');
                rightItem.style.backgroundImage = `url('${item.images.right}')`;
                
                correctFeedback.appendChild(leftItem);
                correctFeedback.appendChild(rightItem);
            } else {
                const singleItem = document.createElement('div');
                singleItem.className = 'correct-feedback-item';
                if (item.largeSize) singleItem.classList.add('large');
                singleItem.style.backgroundImage = `url('${item.image}')`;
                correctFeedback.appendChild(singleItem);
            }
            
            feedbackOverlay.style.display = 'flex';
            feedbackOverlay.classList.add('active');
            
            const displayTime = item.isPair ? 3000 : 2500;
            setTimeout(() => {
                feedbackOverlay.style.display = 'none';
                feedbackOverlay.classList.remove('active');
            }, displayTime);
        }

        // Start the next word
        function startNextWord() {
            if (currentItemIndex >= clothingItems.length) return;
            playClothingAudio(clothingItems[currentItemIndex].audio);
        }

        // Play clothing audio
        function playClothingAudio(audioUrl) {
            if (clothingAudio) {
                clothingAudio.pause();
                clothingAudio.currentTime = 0;
            }
            
            clothingAudio = new Audio(audioUrl);
            clothingAudio.volume = Math.min(volumeSlider.value * 1.5, 1.0);
            
            clothingSpeaker.classList.add('playing');
            isWaitingForAnswer = false;
            
            clothingAudio.addEventListener('play', () => {
                isWaitingForAnswer = true;
            });
            
            clothingAudio.addEventListener('ended', () => {
                clothingSpeaker.classList.remove('playing');
            });
            
            clothingAudio.play();
        }

        // Clear all flying items
        function clearFlyingItems() {
            const clothingElements = flyingItemsContainer.querySelectorAll('.clothing-item');
            clothingElements.forEach(element => {
                element.remove();
            });
            
            activeItems = [];
        }

        // Start fireworks animation
        function startFireworks() {
            fireworksInterval = setInterval(createFirework, 300);
        }

        // Create a firework
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            const left = Math.random() * flyingItemsContainer.scrollWidth;
            const top = Math.random() * flyingItemsContainer.scrollHeight;
            firework.style.left = `${left}px`;
            firework.style.top = `${top}px`;
            
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            firework.style.backgroundColor = color;
            
            const size = 4 + Math.random() * 8;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            flyingItemsContainer.appendChild(firework);
            
            setTimeout(() => {
                if (firework.parentNode) {
                    flyingItemsContainer.removeChild(firework);
                }
            }, 2000);
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                speaker.classList.add('playing');
                volumeControl.classList.add('show');
            } else {
                backgroundMusic.pause();
                backgroundMusic = null;
                
                speaker.classList.remove('playing');
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
