<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #fff;
            cursor: default;
        }

        .header {
            text-align: center;
            margin: 20px 0 30px;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
            animation: titleGlow 3s infinite alternate;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #a0e7ff;
            text-shadow: 0 0 5px #0088ff;
            margin-bottom: 15px;
        }

        .audio-controls-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .audio-controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .music-control, .clothing-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .music-label, .clothing-label {
            font-size: 0.9rem;
            color: #ff9900;
            text-shadow: 0 0 5px #ff9900;
        }

        .speaker {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px #ff9900);
        }

        .clothing-speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px #00ff00);
        }

        .speaker:hover, .clothing-speaker:hover {
            transform: scale(1.1);
        }

        .speaker:hover {
            filter: drop-shadow(0 0 10px #ff9900);
        }

        .clothing-speaker:hover {
            filter: drop-shadow(0 0 10px #00ff00);
        }

        .speaker.playing {
            animation: speakerPulse 1s ease-in-out infinite;
        }

        .clothing-speaker.playing {
            animation: clothingPulse 1s ease-in-out infinite;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .volume-slider {
            width: 100px;
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(90deg, #ff9900, #ffcc00);
            border-radius: 4px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff9900;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.8);
        }

        .game-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1600px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .column {
            flex: 1;
            min-width: 350px;
            max-width: 600px;
            background: rgba(0, 20, 40, 0.8);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .column-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
            padding-bottom: 15px;
            border-bottom: 2px solid #00aaff;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            height: 700px;
            overflow-y: auto;
            padding-right: 15px;
        }

        .items-list::-webkit-scrollbar {
            width: 10px;
        }

        .items-list::-webkit-scrollbar-track {
            background: rgba(0, 50, 100, 0.5);
            border-radius: 10px;
        }

        .items-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00aaff, #0088ff);
            border-radius: 10px;
        }

        .text-item, .image-item {
            background: rgba(0, 40, 80, 0.7);
            border: 2px solid #0088ff;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
            position: relative;
            overflow: hidden;
        }

        .text-item {
            gap: 20px;
        }

        .text-item:hover, .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 25px rgba(0, 150, 255, 0.4);
            border-color: #00ccff;
        }

        .text-item.selected, .image-item.selected {
            background: rgba(0, 100, 200, 0.5);
            border-color: #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .text-item.correct, .image-item.correct {
            animation: correctGlow 5s forwards;
        }

        .text-item.incorrect, .image-item.incorrect {
            animation: incorrectGlow 3s;
        }

        .item-text {
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00aaff;
            text-align: center;
            flex-grow: 1;
        }

        .audio-icon {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 5px #ff9900);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-icon:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px #ff9900);
        }

        .item-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .item-image {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px #00aaff);
        }

        .paired-images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .paired-image {
            max-width: 45%;
            max-height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px #00aaff);
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-restart {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.5);
        }

        .score-container {
            background: rgba(0, 20, 40, 0.9);
            padding: 25px 50px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 40px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
            margin-bottom: 30px;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px #8a2be2, 0 0 25px #8a2be2, 0 0 35px #8a2be2;
            animation: scoreGlow 2s infinite alternate;
        }

        .timer {
            font-size: 1.8rem;
            color: #00ffea;
            text-shadow: 0 0 10px #00ffea;
        }

        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 30, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .feedback-content {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .feedback-title {
            font-size: 4.5rem;
            margin-bottom: 40px;
            text-shadow: 0 0 25px;
        }

        .feedback-title.correct {
            color: #00ff00;
            text-shadow: 0 0 25px #00ff00;
        }

        .feedback-title.incorrect {
            color: #ff0000;
            text-shadow: 0 0 25px #ff0000;
        }

        .feedback-image-container {
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .feedback-image {
            width: 250px;
            height: 250px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
        }

        .feedback-paired-images {
            display: flex;
            gap: 40px;
        }

        .feedback-paired-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
        }

        .feedback-text {
            font-size: 3rem;
            margin-top: 30px;
            text-shadow: 0 0 20px;
        }

        .correct-image {
            filter: drop-shadow(0 0 25px #00ff00);
        }

        .incorrect-image {
            filter: drop-shadow(0 0 25px #ff0000);
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
            }
            100% {
                text-shadow: 0 0 15px #00ffea, 0 0 30px #00ffea, 0 0 45px #00ffea;
            }
        }

        @keyframes scoreGlow {
            0% {
                text-shadow: 0 0 15px #8a2be2, 0 0 25px #8a2be2, 0 0 35px #8a2be2;
            }
            100% {
                text-shadow: 0 0 20px #8a2be2, 0 0 35px #8a2be2, 0 0 50px #8a2be2;
            }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #ff9900);
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px #ff9900);
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #ff9900);
            }
        }

        @keyframes clothingPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #00ff00);
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px #00ff00);
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #00ff00);
            }
        }

        @keyframes correctGlow {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
                border-color: #00ff00;
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
                border-color: #00ff00;
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
                display: none;
            }
        }

        @keyframes incorrectGlow {
            0% {
                background: rgba(255, 0, 0, 0.3);
                border-color: #ff0000;
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            }
            50% {
                background: rgba(255, 0, 0, 0.5);
                border-color: #ff0000;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            }
            100% {
                background: rgba(0, 40, 80, 0.7);
                border-color: #0088ff;
                box-shadow: none;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* Адаптация для планшетов */
        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .column {
                width: 95%;
                max-width: 700px;
            }
            
            .audio-controls-container {
                top: 10px;
                right: 10px;
            }
            
            .game-title {
                font-size: 2.2rem;
            }
            
            .items-list {
                height: 500px;
            }
        }

        /* Адаптация для мобильных телефонов */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8rem;
                margin-top: 60px;
            }
            
            .column {
                min-width: 280px;
                padding: 20px;
            }
            
            .items-list {
                height: 450px;
            }
            
            .item-text {
                font-size: 1.2rem;
            }
            
            .audio-icon {
                width: 35px;
                height: 35px;
            }
            
            .score-container {
                padding: 20px 30px;
                flex-direction: column;
                gap: 20px;
            }
            
            .score {
                font-size: 2rem;
            }
            
            .btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
            
            .feedback-title {
                font-size: 3rem;
            }
            
            .feedback-image, .feedback-paired-image {
                width: 150px;
                height: 150px;
            }
            
            .feedback-text {
                font-size: 2.2rem;
            }
            
            .audio-controls {
                padding: 10px;
            }
            
            .speaker, .clothing-speaker {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 1.5rem;
            }
            
            .column-title {
                font-size: 1.6rem;
            }
            
            .text-item, .image-item {
                padding: 20px;
                min-height: 90px;
            }
            
            .item-text {
                font-size: 1.1rem;
            }
            
            .score {
                font-size: 1.8rem;
            }
            
            .timer {
                font-size: 1.4rem;
            }
            
            .items-list {
                height: 400px;
            }
            
            .feedback-title {
                font-size: 2.5rem;
            }
            
            .feedback-text {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

        // Game state
        let score = 0;
        let matches = 0;
        let selectedTextItem = null;
        let selectedImageItem = null;
        let matchedPairs = [];
        let backgroundMusic = null;
        let clothingAudio = null;
        let fireworksInterval = null;
        let clothingAudioPlaying = false;

        // DOM elements
        const textItemsContainer = document.getElementById('textItems');
        const imageItemsContainer = document.getElementById('imageItems');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const musicSpeaker = document.getElementById('musicSpeaker');
        const clothingSpeaker = document.getElementById('clothingSpeaker');
        const volumeSlider = document.getElementById('volumeSlider');
        const restartBtn = document.getElementById('restartBtn');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackImageContainer = document.getElementById('feedbackImageContainer');
        const feedbackText = document.getElementById('feedbackText');

        // Initialize game
        function initGame() {
            resetGame();
            createItems();
            setupEventListeners();
            startFireworks();
        }

        // Reset game state
        function resetGame() {
            score = 0;
            matches = 0;
            selectedTextItem = null;
            selectedImageItem = null;
            matchedPairs = [];
            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Matches: ${matches}/${clothingItems.length}`;
        }

        // Create shuffled items
        function createItems() {
            textItemsContainer.innerHTML = '';
            imageItemsContainer.innerHTML = '';
            
            // Shuffle items independently
            const shuffledTextItems = [...clothingItems].sort(() => Math.random() - 0.5);
            const shuffledImageItems = [...clothingItems].sort(() => Math.random() - 0.5);
            
            // Create text items
            shuffledTextItems.forEach(item => {
                if (matchedPairs.includes(item.id)) return;
                
                const textItem = document.createElement('div');
                textItem.className = 'text-item';
                textItem.dataset.id = item.id;
                textItem.dataset.name = item.name;
                
                const audioIcon = document.createElement('img');
                audioIcon.src = 'videos/IMG_20251124_151845_148.png';
                audioIcon.className = 'audio-icon';
                audioIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playClothingAudio(item.audio);
                });
                
                const textSpan = document.createElement('span');
                textSpan.className = 'item-text';
                textSpan.textContent = item.name;
                
                textItem.appendChild(audioIcon);
                textItem.appendChild(textSpan);
                textItem.addEventListener('click', () => selectTextItem(textItem));
                
                textItemsContainer.appendChild(textItem);
            });
            
            // Create image items
            shuffledImageItems.forEach(item => {
                if (matchedPairs.includes(item.id)) return;
                
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                imageItem.dataset.id = item.id;
                imageItem.dataset.name = item.name;
                
                const imageContainer = document.createElement('div');
                imageContainer.className = 'item-image-container';
                
                if (item.isPair) {
                    // For paired items, show only left image in game
                    const pairedContainer = document.createElement('div');
                    pairedContainer.className = 'paired-images';
                    
                    const leftImg = document.createElement('img');
                    leftImg.src = item.images.left;
                    leftImg.alt = item.name;
                    leftImg.className = 'paired-image';
                    
                    pairedContainer.appendChild(leftImg);
                    imageContainer.appendChild(pairedContainer);
                } else {
                    // For single items
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'item-image';
                    imageContainer.appendChild(img);
                }
                
                imageItem.appendChild(imageContainer);
                imageItem.addEventListener('click', () => selectImageItem(imageItem));
                
                imageItemsContainer.appendChild(imageItem);
            });
        }

        // Select text item
        function selectTextItem(item) {
            if (matchedPairs.includes(item.dataset.id)) return;
            
            // Deselect previous selection
            if (selectedTextItem) {
                selectedTextItem.classList.remove('selected');
            }
            
            // Select new item
            item.classList.add('selected');
            selectedTextItem = item;
            
            // Check for match if both selected
            checkMatch();
        }

        // Select image item
        function selectImageItem(item) {
            if (matchedPairs.includes(item.dataset.id)) return;
            
            // Deselect previous selection
            if (selectedImageItem) {
                selectedImageItem.classList.remove('selected');
            }
            
            // Select new item
            item.classList.add('selected');
            selectedImageItem = item;
            
            // Check for match if both selected
            checkMatch();
        }

        // Check if selected items match
        function checkMatch() {
            if (!selectedTextItem || !selectedImageItem) return;
            
            const textId = parseInt(selectedTextItem.dataset.id);
            const imageId = parseInt(selectedImageItem.dataset.id);
            
            if (textId === imageId) {
                // Correct match
                score += 10;
                matches++;
                scoreDisplay.textContent = `Score: ${score}`;
                timerDisplay.textContent = `Matches: ${matches}/${clothingItems.length}`;
                
                // Add to matched pairs
                matchedPairs.push(textId);
                
                // Get item data
                const item = clothingItems.find(item => item.id == textId);
                
                // Show correct feedback
                showFeedback(true, item);
                
                // Remove items after delay (5 seconds)
                setTimeout(() => {
                    selectedTextItem.classList.add('correct');
                    selectedImageItem.classList.add('correct');
                    
                    setTimeout(() => {
                        selectedTextItem.style.display = 'none';
                        selectedImageItem.style.display = 'none';
                        selectedTextItem = null;
                        selectedImageItem = null;
                        
                        // Check if game is complete
                        if (matches === clothingItems.length) {
                            setTimeout(() => {
                                showGameComplete();
                            }, 1000);
                        }
                    }, 500);
                }, 5000);
            } else {
                // Incorrect match
                score = Math.max(0, score - 5);
                scoreDisplay.textContent = `Score: ${score}`;
                
                // Get item data for feedback
                const textItem = clothingItems.find(item => item.id == textId);
                const imageItem = clothingItems.find(item => item.id == imageId);
                
                // Show incorrect feedback with the image that was clicked
                showFeedback(false, imageItem);
                
                // Highlight incorrect
                selectedTextItem.classList.add('incorrect');
                selectedImageItem.classList.add('incorrect');
                
                // Reset after delay (3 seconds)
                setTimeout(() => {
                    selectedTextItem.classList.remove('selected', 'incorrect');
                    selectedImageItem.classList.remove('selected', 'incorrect');
                    selectedTextItem = null;
                    selectedImageItem = null;
                }, 3000);
            }
        }

        // Show feedback overlay
        function showFeedback(isCorrect, item) {
            if (!item) return;
            
            feedbackImageContainer.innerHTML = '';
            
            if (isCorrect) {
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "feedback-title correct";
                feedbackText.textContent = `${item.name} ✓`;
                feedbackText.style.color = "#00ff00";
                
                if (item.isPair) {
                    // Show both images for paired items
                    const pairedContainer = document.createElement('div');
                    pairedContainer.className = 'feedback-paired-images';
                    
                    const leftImg = document.createElement('img');
                    leftImg.src = item.images.left;
                    leftImg.alt = item.name;
                    leftImg.className = 'feedback-paired-image correct-image';
                    
                    const rightImg = document.createElement('img');
                    rightImg.src = item.images.right;
                    rightImg.alt = item.name;
                    rightImg.className = 'feedback-paired-image correct-image';
                    
                    pairedContainer.appendChild(leftImg);
                    pairedContainer.appendChild(rightImg);
                    feedbackImageContainer.appendChild(pairedContainer);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image correct-image';
                    feedbackImageContainer.appendChild(img);
                }
            } else {
                feedbackTitle.textContent = "Try Again!";
                feedbackTitle.className = "feedback-title incorrect";
                feedbackText.textContent = `${item.name} ✗`;
                feedbackText.style.color = "#ff0000";
                
                if (item.isPair) {
                    // Show left image for paired items
                    const img = document.createElement('img');
                    img.src = item.images.left;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                }
            }
            
            feedbackOverlay.style.display = "flex";
            
            // Hide overlay after delay
            const hideDelay = isCorrect ? 5000 : 3000;
            setTimeout(() => {
                feedbackOverlay.style.display = "none";
            }, hideDelay);
        }

        // Show game complete message
        function showGameComplete() {
            feedbackTitle.textContent = "Congratulations!";
            feedbackTitle.className = "feedback-title correct";
            feedbackText.textContent = `You've completed the game!\nFinal Score: ${score}`;
            feedbackText.style.color = "#00ff00";
            feedbackText.style.fontSize = "2.5rem";
            feedbackText.style.lineHeight = "1.5";
            feedbackImageContainer.innerHTML = '<div style="font-size: 8rem;">🎉</div>';
            
            feedbackOverlay.style.display = "flex";
            
            // Add confetti effect
            startConfetti();
            
            setTimeout(() => {
                feedbackOverlay.style.display = "none";
                if (fireworksInterval) clearInterval(fireworksInterval);
            }, 8000);
        }

        // Play clothing audio
        function playClothingAudio(url) {
            if (clothingAudio) {
                clothingAudio.pause();
                clothingAudio.currentTime = 0;
            }
            
            clothingAudio = new Audio(url);
            clothingAudio.volume = volumeSlider.value;
            
            clothingSpeaker.classList.add('playing');
            clothingAudioPlaying = true;
            
            clothingAudio.addEventListener('play', () => {
                clothingAudioPlaying = true;
            });
            
            clothingAudio.addEventListener('ended', () => {
                clothingSpeaker.classList.remove('playing');
                clothingAudioPlaying = false;
            });
            
            clothingAudio.addEventListener('error', () => {
                clothingSpeaker.classList.remove('playing');
                clothingAudioPlaying = false;
                alert('Audio file could not be loaded. Please check the file path.');
            });
            
            clothingAudio.play().catch(error => {
                console.error('Audio playback failed:', error);
                clothingSpeaker.classList.remove('playing');
                clothingAudioPlaying = false;
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Background music
            musicSpeaker.addEventListener('click', toggleBackgroundMusic);
            
            // Clothing speaker (play random clothing audio)
            clothingSpeaker.addEventListener('click', () => {
                if (!clothingAudioPlaying) {
                    const randomItem = clothingItems[Math.floor(Math.random() * clothingItems.length)];
                    playClothingAudio(randomItem.audio);
                }
            });
            
            // Volume control
            volumeSlider.addEventListener('input', adjustVolume);
            
            // Restart button
            restartBtn.addEventListener('click', () => {
                resetGame();
                createItems();
                if (fireworksInterval) clearInterval(fireworksInterval);
                startFireworks();
            });
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                
                backgroundMusic.addEventListener('error', () => {
                    alert('Background music file could not be loaded. Please check the file path.');
                    musicSpeaker.classList.remove('playing');
                    backgroundMusic = null;
                });
                
                backgroundMusic.play().then(() => {
                    musicSpeaker.classList.add('playing');
                }).catch(error => {
                    console.error('Background music playback failed:', error);
                    musicSpeaker.classList.remove('playing');
                    backgroundMusic = null;
                });
            } else {
                if (backgroundMusic.paused) {
                    backgroundMusic.play();
                    musicSpeaker.classList.add('playing');
                } else {
                    backgroundMusic.pause();
                    musicSpeaker.classList.remove('playing');
                }
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
            if (clothingAudio) {
                clothingAudio.volume = volume;
            }
        }

        // Start fireworks
        function startFireworks() {
            fireworksInterval = setInterval(createFirework, 400);
        }

        // Start confetti effect
        function startConfetti() {
            const confettiInterval = setInterval(() => {
                for (let i = 0; i < 15; i++) {
                    createFirework();
                }
            }, 200);
            
            setTimeout(() => {
                clearInterval(confettiInterval);
            }, 7000);
        }

        // Create firework
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // Random position
            const left = Math.random() * window.innerWidth;
            const top = Math.random() * window.innerHeight;
            firework.style.left = `${left}px`;
            firework.style.top = `${top}px`;
            
            // Random color
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900', '#ff00aa'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            firework.style.backgroundColor = color;
            
            // Random size
            const size = 4 + Math.random() * 8;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            // Add to body
            document.body.appendChild(firework);
            
            // Remove after animation
            setTimeout(() => {
                if (firework.parentNode) {
                    firework.remove();
                }
            }, 2000);
        }

        // Initialize game on load
        window.addEventListener('DOMContentLoaded', initGame);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            // Update layout if needed
        });
    </script>
