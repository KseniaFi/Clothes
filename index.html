<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одень девушку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }

        .speaker:hover {
            transform: scale(1.1);
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .volume-control.show {
            display: block;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
        }

        .model-container {
            position: relative;
            width: 300px;
            height: 500px;
            margin: 20px auto;
        }

        .model {
            width: 100%;
            height: 100%;
            background: url('videos/IMG_20251121_000147_995.png') no-repeat center center;
            background-size: contain;
            position: relative;
        }

        .clothing-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .clothing-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .clothing-item:hover {
            transform: scale(1.05);
        }

        .wardrobe-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .current-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .item-image {
            width: 150px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 10px 0;
        }

        .item-name {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 5px 15px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-remove {
            background: #e74c3c;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes flyToModel {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2) translateY(-20px); opacity: 0.7; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            .model-container {
                width: 250px;
                height: 400px;
            }
            
            .item-name {
                font-size: 20px;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 16px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
        }

        @media (max-width: 480px) {
            .model-container {
                width: 200px;
                height: 350px;
            }
            
            .item-name {
                font-size: 18px;
            }
            
            .wardrobe-container {
                padding: 10px;
            }
            
            .item-image {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>

        const currentItemName = document.getElementById('currentItemName');

        const nextBtn = document.getElementById('nextBtn');

        const speaker = document.getElementById('speaker');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');

        // Инициализация
        function init() {
            displayCurrentItem();
            
            // Обработчики событий
            prevBtn.addEventListener('click', showPreviousItem);
            nextBtn.addEventListener('click', showNextItem);
            removeBtn.addEventListener('click', removeCurrentItem);
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            
            // Автоматическое надевание через 5 секунд
            setTimeout(autoWearItem, 5000);
        }

        // Показать текущий предмет одежды
        function displayCurrentItem() {
            const item = clothingItems[currentItemIndex];
            
            // Установить изображение
            currentItemImage.style.backgroundImage = `url('${item.image}')`;
            
            // Показать название с анимацией
            currentItemName.textContent = item.name;
            currentItemName.style.display = 'block';
            
            // Воспроизвести произношение
            playPronunciation(item.audio);
            
            // Скрыть название через 5 секунд
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(() => {
                currentItemName.style.display = 'none';
            }, 5000);
        }

        // Показать предыдущий предмет
        function showPreviousItem() {
            currentItemIndex = (currentItemIndex - 1 + clothingItems.length) % clothingItems.length;
            displayCurrentItem();
            
            // Перезапустить таймер автоматического надевания
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(autoWearItem, 5000);
        }

        // Показать следующий предмет
        function showNextItem() {
            currentItemIndex = (currentItemIndex + 1) % clothingItems.length;
            displayCurrentItem();
            
            // Перезапустить таймер автоматического надевания
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(autoWearItem, 5000);
        }

        // Автоматически надеть текущий предмет
        function autoWearItem() {
            wearItem(currentItemIndex);
        }

        // Надеть предмет на модель
        function wearItem(index) {
            // Проверить, не надет ли уже этот предмет
            if (wornItems.includes(index)) return;
            
            const item = clothingItems[index];
            
            // Создать элемент одежды
            const clothingElement = document.createElement('div');
            clothingElement.className = 'clothing-item';
            clothingElement.style.backgroundImage = `url('${item.image}')`;
            clothingElement.style.backgroundSize = 'contain';
            clothingElement.style.backgroundRepeat = 'no-repeat';
            clothingElement.style.backgroundPosition = 'center';
            
            // Установить позиционирование
            clothingElement.style.top = item.position.top;
            clothingElement.style.left = item.position.left;
            clothingElement.style.width = item.position.width;
            clothingElement.style.height = 'auto';
            clothingElement.style.aspectRatio = '1/1';
            
            // Добавить обработчик для снятия
            clothingElement.addEventListener('click', () => {
                removeItem(index);
            });
            
            // Добавить на модель
            model.appendChild(clothingElement);
            
            // Добавить в список надетых
            wornItems.push(index);
            
            // Анимация "улетания" на модель
            clothingElement.style.animation = 'flyToModel 1s forwards';
        }

        // Снять текущий предмет
        function removeCurrentItem() {
            removeItem(currentItemIndex);
        }

        // Снять предмет с модели
        function removeItem(index) {
            // Найти элемент на модели и удалить его
            const clothingElements = model.querySelectorAll('.clothing-item');
            clothingElements.forEach(element => {
                if (element.style.backgroundImage.includes(clothingItems[index].image)) {
                    element.remove();
                }
            });
            
            // Удалить из списка надетых
            wornItems = wornItems.filter(itemIndex => itemIndex !== index);
        }

        // Воспроизвести произношение
        function playPronunciation(audioUrl) {
            // Остановить предыдущее произношение, если оно играет
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Создать новый аудио элемент
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = volumeSlider.value;
            pronunciationAudio.play();
        }

        // Управление фоновой музыкой
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Создать и запустить фоновую музыку
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Показать регулятор громкости
                volumeControl.classList.add('show');
            } else {
                // Остановить музыку
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Скрыть регулятор громкости
                volumeControl.classList.remove('show');
            }
        }

        // Регулировка громкости
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
            
            if (pronunciationAudio) {
                pronunciationAudio.volume = volume;
            }
        }

        // Запуск приложения
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
