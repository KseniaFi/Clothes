<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #333;
            cursor: default;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            position: relative;
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .speaker-hint {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite, neonPulse 1.5s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .speaker-hint-second {
            position: absolute;
            top: -80px;
            left: 60%;
            transform: translateX(-50%);
            width: 35px;
            height: 35px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite reverse, neonPulse 1.8s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .flashcards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-top: 80px;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            height: 550px;
            perspective: 1000px;
            margin-bottom: 40px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: cover;
        }

        .card-front {
            color: white;
        }

        .card-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            animation: pulseGlow 2s infinite;
            pointer-events: none;
            z-index: 1;
        }

        .card-back {
            transform: rotateY(180deg);
            color: white;
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: cover;
        }

        .card-image {
            width: 100%;
            height: 80%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 10px;
            transition: all 0.3s;
            position: relative;
            z-index: 2;
        }

        .single-item-image {
            background-size: contain;
            max-width: 80%;
            max-height: 70%;
        }

        .pair-item-image {
            background-size: contain;
            max-width: 90%;
            max-height: 75%;
        }

        .pair-image {
            background-size: 48%, 48%;
            background-position: 25% center, 75% center;
        }

        .card-name {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            padding: 12px 30px;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
            margin-top: 10px;
            width: 90%;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
            width: 100%;
        }

        .btn {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            font-family: 'Georgia', serif;
            font-weight: bold;
            min-width: 140px;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-flip {
            background: #9b59b6;
        }

        .btn-flip:hover {
            background: #8e44ad;
        }

        .btn-prev {
            background: #e67e22;
        }

        .btn-prev:hover {
            background: #d35400;
        }

        .btn-next {
            background: #e67e22;
        }

        .btn-next:hover {
            background: #d35400;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
        }

        @keyframes bounceArrow {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-20px); 
            }
        }

        @keyframes neonPulse {
            from {
                filter: drop-shadow(0 0 5px silver) drop-shadow(0 0 10px silver);
            }
            to {
                filter: drop-shadow(0 0 10px silver) drop-shadow(0 0 20px silver) drop-shadow(0 0 30px silver);
            }
        }

        @keyframes pulseGlow {
            0% { 
                box-shadow: 0 0 10px #00ff00;
            }
            50% { 
                box-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00;
            }
            100% { 
                box-shadow: 0 0 10px #00ff00;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .card {
                height: 450px;
                max-width: 600px;
            }
            
            .card-name {
                font-size: 26px;
                padding: 10px 20px;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 16px;
                min-width: 120px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .card-image {
                height: 75%;
            }
            
            .flashcard-controls {
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .card {
                height: 400px;
                max-width: 500px;
            }
            
            .card-name {
                font-size: 22px;
                padding: 8px 15px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 16px;
                min-width: 110px;
            }
            
            .card-image {
                height: 70%;
            }
            
            .flashcard-controls {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .card {
                height: 350px;
                max-width: 400px;
            }
            
            .card-name {
                font-size: 20px;
                padding: 8px 12px;
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 14px;
                min-width: 100px;
            }
            
            .flashcard-controls {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            
            .btn {
                width: 120px;
            }
            
            .card-image {
                height: 65%;
            }
        }

        @media (max-width: 360px) {
            .card {
                height: 320px;
                max-width: 320px;
            }
            
            .card-name {
                font-size: 18px;
            }
            
            .flashcard-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
                max-width: 90%;
            }
            
            .card-image {
                height: 60%;
            }
        }
    </style>
</head>
