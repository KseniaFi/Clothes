    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #333;
            cursor: default;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }

        .speaker:hover {
            transform: scale(1.1);
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .volume-control.show {
            display: block;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
        }

        .model-container {
            position: relative;
            width: 300px;
            height: 500px;
            margin: 20px auto;
        }

        .model {
            width: 100%;
            height: 100%;
            background: url('videos/IMG_20251121_000147_995.png') no-repeat center center;
            background-size: contain;
            position: relative;
            cursor: pointer;
        }

        .clothing-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .clothing-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .clothing-item:hover {
            transform: scale(1.05);
        }

        .clothing-item.active {
            animation: pulseGlow 1.5s infinite;
        }

        .hint-arrow {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 50;
            animation: bounceArrow 2s infinite;
            display: none;
        }

        .hint-text {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        .wardrobe-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: contain;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 250px;
        }

        .current-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .item-image {
            width: 150px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .item-image.active {
            animation: pulseGlow 1.5s infinite;
            transform: scale(1.1);
        }

        .item-name {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 5px 15px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-remove {
            background: #e74c3c;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes flyToModel {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2) translateY(-20px); opacity: 0.7; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
            50% { 
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00);
            }
            100% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
        }

        @keyframes bounceArrow {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-20px); 
            }
        }

        /* Responsive design for mobile devices */
        @media (max-width: 768px) {
            .model-container {
                width: 250px;
                height: 400px;
            }
            
            .item-name {
                font-size: 20px;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 16px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .wardrobe-container {
                min-height: 200px;
            }
        }

        @media (max-width: 480px) {
            .model-container {
                width: 200px;
                height: 350px;
            }
            
            .item-name {
                font-size: 18px;
            }
            
            .wardrobe-container {
                padding: 10px;
                min-height: 180px;
            }
            
            .item-image {
                width: 120px;
                height: 120px;
            }
            
            .hint-arrow {
                width: 60px;
                height: 60px;
            }
            
            .hint-text {
                font-size: 16px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const removeBtn = document.getElementById('removeBtn');
        const speaker = document.getElementById('speaker');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const hintArrow = document.getElementById('hintArrow');
        const hintText = document.getElementById('hintText');

        // Initialize
        function init() {
            displayCurrentItem();
            
            // Event handlers
            prevBtn.addEventListener('click', showPreviousItem);
            nextBtn.addEventListener('click', showNextItem);
            removeBtn.addEventListener('click', removeCurrentItem);
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            document.addEventListener('click', handleDocumentClick);
            
            // Start placement mode after 5 seconds
            setTimeout(startPlacementMode, 5000);
        }

        // Show current clothing item
        function displayCurrentItem() {
            const item = clothingItems[currentItemIndex];
            
            // Set image
            currentItemImage.style.backgroundImage = `url('${item.image}')`;
            
            // Show name with animation
            currentItemName.textContent = item.name;
            currentItemName.style.display = 'block';
            
            // Play pronunciation
            playPronunciation(item.audio);
            
            // Hide name after 5 seconds
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(() => {
                currentItemName.style.display = 'none';
            }, 5000);
        }

        // Show previous item
        function showPreviousItem() {
            currentItemIndex = (currentItemIndex - 1 + clothingItems.length) % clothingItems.length;
            displayCurrentItem();
            
            // Restart placement mode timer
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(startPlacementMode, 5000);
            
            // Exit placement mode if active
            exitPlacementMode();
        }

        // Show next item
        function showNextItem() {
            currentItemIndex = (currentItemIndex + 1) % clothingItems.length;
            displayCurrentItem();
            
            // Restart placement mode timer
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(startPlacementMode, 5000);
            
            // Exit placement mode if active
            exitPlacementMode();
        }

        // Start placement mode
        function startPlacementMode() {
            // Only show hint for the first two times
            if (hintDisplayCount >= maxHintDisplays) {
                return;
            }
            
            hintDisplayCount++;
            
            isPlacingMode = true;
            
            // Add active class to current item
            currentItemImage.classList.add('active');
            
            // Show hint arrow and text
            hintArrow.style.top = "50%";
            hintArrow.style.left = "50%";
            hintArrow.style.transform = "translate(-50%, -50%)";
            hintArrow.style.display = 'block';
            
            hintText.style.top = "60%";
            hintText.style.left = "50%";
            hintText.style.transform = "translateX(-50%)";
            hintText.style.display = 'block';
        }

        // Exit placement mode
        function exitPlacementMode() {
            isPlacingMode = false;
            currentItemImage.classList.remove('active');
            hintArrow.style.display = 'none';
            hintText.style.display = 'none';
        }

        // Handle document click
        function handleDocumentClick(event) {
            // Check if we're in placement mode and not clicking on UI elements
            if (!isPlacingMode || 
                event.target.closest('.audio-control') || 
                event.target.closest('.wardrobe-container') ||
                event.target.closest('.controls')) {
                return;
            }
            
            // Place the current item at the click position
            placeClothingAtPosition(event.clientX, event.clientY);
            
            // Exit placement mode
            exitPlacementMode();
        }

        // Place clothing at specific position
        function placeClothingAtPosition(x, y) {
            const item = clothingItems[currentItemIndex];
            
            // Calculate position relative to model container
            const modelRect = model.getBoundingClientRect();
            const relativeX = x - modelRect.left;
            const relativeY = y - modelRect.top;
            
            // Calculate percentages for positioning
            const percentX = (relativeX / modelRect.width) * 100;
            const percentY = (relativeY / modelRect.height) * 100;
            
            // Wear the item at the calculated position
            wearItem(currentItemIndex, percentX, percentY);
        }

        // Wear item on model at specific position
        function wearItem(index, xPercent = null, yPercent = null) {
            // Check if item is already worn
            if (wornItems.includes(index)) return;
            
            const item = clothingItems[currentItemIndex];
            
            // Create clothing element
            const clothingElement = document.createElement('div');
            clothingElement.className = 'clothing-item';
            clothingElement.style.backgroundImage = `url('${item.image}')`;
            clothingElement.style.backgroundSize = 'contain';
            clothingElement.style.backgroundRepeat = 'no-repeat';
            clothingElement.style.backgroundPosition = 'center';
            
            // Set positioning - use clicked position or default position
            if (xPercent !== null && yPercent !== null) {
                clothingElement.style.top = `${yPercent}%`;
                clothingElement.style.left = `${xPercent}%`;
                clothingElement.style.transform = 'translate(-50%, -50%)';
            } else {
                clothingElement.style.top = item.position.top;
                clothingElement.style.left = item.position.left;
            }
            
            clothingElement.style.width = item.position.width;
            clothingElement.style.height = 'auto';
            clothingElement.style.aspectRatio = '1/1';
            
            // Add click handler for removal
            clothingElement.addEventListener('click', (e) => {
                e.stopPropagation();
                removeItem(index);
            });
            
            // Add to model
            model.appendChild(clothingElement);
            
            // Add to worn items list
            wornItems.push(index);
            
            // Add animation
            clothingElement.style.animation = 'flyToModel 1s forwards';
        }

        // Remove current item
        function removeCurrentItem() {
            removeItem(currentItemIndex);
        }

        // Remove item from model
        function removeItem(index) {
            // Find element on model and remove it
            const clothingElements = model.querySelectorAll('.clothing-item');
            clothingElements.forEach(element => {
                if (element.style.backgroundImage.includes(clothingItems[index].image)) {
                    element.remove();
                }
            });
            
            // Remove from worn items list
            wornItems = wornItems.filter(itemIndex => itemIndex !== index);
        }

        // Play pronunciation
        function playPronunciation(audioUrl) {
            // Stop previous pronunciation if playing
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Create new audio element
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = volumeSlider.value;
            pronunciationAudio.play();
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Create and play background music
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Show volume control
                volumeControl.classList.add('show');
            } else {
                // Stop music
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Hide volume control
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
            
            if (pronunciationAudio) {
                pronunciationAudio.volume = volume;
            }
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
