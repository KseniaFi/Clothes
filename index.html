<!DOCTYPE html>

    <title>Dress Up Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #333;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }

        .speaker:hover {
            transform: scale(1.1);
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .volume-control.show {
            display: block;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 100px; /* Increased to position model lower */
        }

        .model-container {
            position: relative;
            width: 350px; /* Increased size */
            height: 550px; /* Increased size */
            margin: 20px auto;
        }

        .model {
            width: 100%;
            height: 100%;
            background: url('videos/IMG_20251121_000147_995.png') no-repeat center center;
            background-size: contain;
            position: relative;
            cursor: pointer;
        }

        .clothing-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .clothing-item {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            transition: transform 0.3s;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .clothing-item.dragging {
            cursor: grabbing;
            z-index: 100;
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.7));
        }

        .clothing-item.active {
            animation: pulseGlow 1.5s infinite;
        }

        .hint-arrow {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 50;
            animation: bounceArrow 2s infinite;
            display: none;
        }

        .hint-text {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        .wardrobe-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: contain;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 250px;
        }

        .current-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .item-image {
            width: 200px; /* Increased size */
            height: 200px; /* Increased size */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 10px 0;
            transition: all 0.3s;
            cursor: grab;
        }

        .item-image.active {
            animation: pulseGlow 1.5s infinite;
            transform: scale(1.1);
            cursor: grab;
        }

        .item-image.dragging {
            cursor: grabbing;
            transform: scale(1.2);
            filter: drop-shadow(0 0 15px rgba(0, 255, 0, 0.8));
        }

        .item-name {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 5px 15px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-remove {
            background: #e74c3c;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .drop-zone {
            position: absolute;
            border: 2px dashed rgba(0, 255, 0, 0.5);
            border-radius: 10px;
            background: rgba(0, 255, 0, 0.1);
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        .drop-zone.active {
            display: block;
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes flyToModel {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2) translateY(-20px); opacity: 0.7; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
            50% { 
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00);
            }
            100% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
        }

        @keyframes bounceArrow {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-20px); 
            }
        }

        /* Responsive design for mobile devices */
        @media (max-width: 768px) {
            .model-container {
                width: 280px;
                height: 450px;
            }
            
            .item-name {
                font-size: 20px;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 16px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .wardrobe-container {
                min-height: 200px;
            }
            
            .item-image {
                width: 160px;
                height: 160px;
            }
        }

        @media (max-width: 480px) {
            .model-container {
                width: 220px;
                height: 380px;
            }
            
            .item-name {
                font-size: 18px;
            }
            
            .wardrobe-container {
                padding: 10px;
                min-height: 180px;
            }
            
            .item-image {
                width: 140px;
                height: 140px;
            }
            
            .hint-arrow {
                width: 60px;
                height: 60px;
            }
            
            .hint-text {
                font-size: 16px;
                padding: 8px 12px;
            }
        }
    </style>

                audio: "videos/J-20251125181731846Z.mp3",
                position: { top: "70%", left: "25%", width: "50%" },
                type: "feet",
                dropZone: "feetDropZone"
            },
            {
                name: "Rain boots",
                image: "videos/1763743394.png",
                audio: "videos/J-20251125181904099Z.mp3",
                position: { top: "65%", left: "25%", width: "50%" },
                type: "feet",
                dropZone: "feetDropZone"
            },
            {
                name: "Thigh-high boots",
                image: "videos/1763743296.png",
                audio: "videos/J-20251125183659959Z.mp3",
                position: { top: "50%", left: "25%", width: "50%" },
                type: "legs",
                dropZone: "legsDropZone"
            },
            {
                name: "Heeled over-the-knee boots",
                image: "videos/IMG_20251125_222515_088.png",
                audio: "videos/J-20251125184613900Z.mp3",
                position: { top: "50%", left: "25%", width: "50%" },
                type: "legs",
                dropZone: "legsDropZone"
            },
            {
                name: "Heeled ankle boots",
                image: "videos/IMG_20251123_163324_828.png",
                audio: "videos/J-20251125183935749Z.mp3",
                position: { top: "70%", left: "25%", width: "50%" },
                type: "feet",
                dropZone: "feetDropZone"
            },
            {
                name: "Fluffy slippers",
                image: "videos/1763743348.png",
                audio: "videos/J-20251125184120836Z.mp3",
                position: { top: "75%", left: "25%", width: "50%" },
                type: "feet",
                dropZone: "feetDropZone"
            }
        ];

        // State variables
        let currentItemIndex = 0;
        let wornItems = [];
        let backgroundMusic = null;
        let pronunciationAudio = null;
        let nameTimeout = null;
        let isDragging = false;
        let dragItem = null;
        let hintDisplayCount = 0;
        const maxHintDisplays = 2;

        // DOM elements
        const model = document.getElementById('model');
        const currentItemImage = document.getElementById('currentItemImage');
        const currentItemName = document.getElementById('currentItemName');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const removeBtn = document.getElementById('removeBtn');
        const speaker = document.getElementById('speaker');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const hintArrow = document.getElementById('hintArrow');
        const hintText = document.getElementById('hintText');
        const headDropZone = document.getElementById('headDropZone');
        const bodyDropZone = document.getElementById('bodyDropZone');
        const legsDropZone = document.getElementById('legsDropZone');
        const feetDropZone = document.getElementById('feetDropZone');

        // Drop zone positions (relative to model)
        const dropZones = {
            headDropZone: { top: "0%", left: "20%", width: "60%", height: "25%" },
            bodyDropZone: { top: "15%", left: "10%", width: "80%", height: "45%" },
            legsDropZone: { top: "35%", left: "20%", width: "60%", height: "35%" },
            feetDropZone: { top: "65%", left: "25%", width: "50%", height: "25%" }
        };

        // Initialize
        function init() {
            displayCurrentItem();
            setupDropZones();
            
            // Event handlers
            prevBtn.addEventListener('click', showPreviousItem);
            nextBtn.addEventListener('click', showNextItem);
            removeBtn.addEventListener('click', removeCurrentItem);
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            
            // Drag and drop handlers
            currentItemImage.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', stopDrag);
            
            // Touch events for mobile
            currentItemImage.addEventListener('touchstart', startDragTouch);
            document.addEventListener('touchmove', handleDragTouch);
            document.addEventListener('touchend', stopDrag);
            
            // Start placement mode after 5 seconds
            setTimeout(startPlacementMode, 5000);
        }

        // Set up drop zones
        function setupDropZones() {
            for (const [zoneId, position] of Object.entries(dropZones)) {
                const zone = document.getElementById(zoneId);
                zone.style.top = position.top;
                zone.style.left = position.left;
                zone.style.width = position.width;
                zone.style.height = position.height;
            }
        }

        // Show current clothing item
        function displayCurrentItem() {
            const item = clothingItems[currentItemIndex];
            
            // Set image
            currentItemImage.style.backgroundImage = `url('${item.image}')`;
            
            // Show name with animation
            currentItemName.textContent = item.name;
            currentItemName.style.display = 'block';
            
            // Play pronunciation
            playPronunciation(item.audio);
            
            // Hide name after 5 seconds
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(() => {
                currentItemName.style.display = 'none';
            }, 5000);
        }

        // Show previous item
        function showPreviousItem() {
            currentItemIndex = (currentItemIndex - 1 + clothingItems.length) % clothingItems.length;
            displayCurrentItem();
            
            // Restart placement mode timer
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(startPlacementMode, 5000);
            
            // Exit placement mode if active
            exitPlacementMode();
        }

        // Show next item
        function showNextItem() {
            currentItemIndex = (currentItemIndex + 1) % clothingItems.length;
            displayCurrentItem();
            
            // Restart placement mode timer
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(startPlacementMode, 5000);
            
            // Exit placement mode if active
            exitPlacementMode();
        }

        // Start placement mode
        function startPlacementMode() {
            // Only show hint for the first two times
            if (hintDisplayCount >= maxHintDisplays) {
                return;
            }
            
            hintDisplayCount++;
            
            // Add active class to current item
            currentItemImage.classList.add('active');
            
            // Show relevant drop zone
            const item = clothingItems[currentItemIndex];
            const dropZone = document.getElementById(item.dropZone);
            if (dropZone) {
                dropZone.classList.add('active');
            }
            
            // Show hint arrow and text
            hintArrow.style.top = "50%";
            hintArrow.style.left = "50%";
            hintArrow.style.transform = "translate(-50%, -50%)";
            hintArrow.style.display = 'block';
            
            hintText.style.top = "60%";
            hintText.style.left = "50%";
            hintText.style.transform = "translateX(-50%)";
            hintText.style.display = 'block';
        }

        // Exit placement mode
        function exitPlacementMode() {
            currentItemImage.classList.remove('active');
            hintArrow.style.display = 'none';
            hintText.style.display = 'none';
            
            // Hide all drop zones
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('active');
            });
        }

        // Start dragging (mouse)
        function startDrag(e) {
            isDragging = true;
            dragItem = currentItemImage;
            dragItem.classList.add('dragging');
            
            // Show relevant drop zone
            const item = clothingItems[currentItemIndex];
            const dropZone = document.getElementById(item.dropZone);
            if (dropZone) {
                dropZone.classList.add('active');
            }
            
            e.preventDefault();
        }

        // Start dragging (touch)
        function startDragTouch(e) {
            isDragging = true;
            dragItem = currentItemImage;
            dragItem.classList.add('dragging');
            
            // Show relevant drop zone
            const item = clothingItems[currentItemIndex];
            const dropZone = document.getElementById(item.dropZone);
            if (dropZone) {
                dropZone.classList.add('active');
            }
            
            e.preventDefault();
        }

        // Handle dragging (mouse)
        function handleDrag(e) {
            if (!isDragging || !dragItem) return;
            
            // Position the drag item at cursor
            dragItem.style.position = 'fixed';
            dragItem.style.left = (e.clientX - dragItem.offsetWidth / 2) + 'px';
            dragItem.style.top = (e.clientY - dragItem.offsetHeight / 2) + 'px';
            dragItem.style.zIndex = '1000';
        }

        // Handle dragging (touch)
        function handleDragTouch(e) {
            if (!isDragging || !dragItem || !e.touches.length) return;
            
            // Position the drag item at touch point
            const touch = e.touches[0];
            dragItem.style.position = 'fixed';
            dragItem.style.left = (touch.clientX - dragItem.offsetWidth / 2) + 'px';
            dragItem.style.top = (touch.clientY - dragItem.offsetHeight / 2) + 'px';
            dragItem.style.zIndex = '1000';
        }

        // Stop dragging
        function stopDrag(e) {
            if (!isDragging || !dragItem) return;
            
            // Check if dropped over the correct drop zone
            const item = clothingItems[currentItemIndex];
            const dropZone = document.getElementById(item.dropZone);
            
            if (dropZone && isOverElement(dropZone, e)) {
                wearItem(currentItemIndex);
            }
            
            // Reset drag item
            dragItem.classList.remove('dragging');
            dragItem.style.position = '';
            dragItem.style.left = '';
            dragItem.style.top = '';
            dragItem.style.zIndex = '';
            
            // Hide drop zone
            if (dropZone) {
                dropZone.classList.remove('active');
            }
            
            isDragging = false;
            dragItem = null;
            
            // Exit placement mode
            exitPlacementMode();
        }

        // Check if event is over an element
        function isOverElement(element, e) {
            const rect = element.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.type.includes('touch')) {
                if (!e.touches.length) return false;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return (
                clientX >= rect.left &&
                clientX <= rect.right &&
                clientY >= rect.top &&
                clientY <= rect.bottom
            );
        }

        // Wear item on model
        function wearItem(index) {
            // Check if item is already worn
            if (wornItems.includes(index)) return;
            
            const item = clothingItems[index];
            
            // Create clothing element
            const clothingElement = document.createElement('div');
            clothingElement.className = 'clothing-item';
            clothingElement.style.backgroundImage = `url('${item.image}')`;
            clothingElement.style.backgroundSize = 'contain';
            clothingElement.style.backgroundRepeat = 'no-repeat';
            clothingElement.style.backgroundPosition = 'center';
            
            // Set positioning
            clothingElement.style.top = item.position.top;
            clothingElement.style.left = item.position.left;
            clothingElement.style.width = item.position.width;
            clothingElement.style.height = 'auto';
            clothingElement.style.aspectRatio = '1/1';
            
            // Make draggable for repositioning
            clothingElement.addEventListener('mousedown', startDragClothing);
            clothingElement.addEventListener('touchstart', startDragClothingTouch);
            
            // Add to model
            model.appendChild(clothingElement);
            
            // Add to worn items list
            wornItems.push(index);
            
            // Add animation
            clothingElement.style.animation = 'flyToModel 1s forwards';
        }

        // Start dragging clothing already on model
        function startDragClothing(e) {
            isDragging = true;
            dragItem = e.target;
            dragItem.classList.add('dragging');
            
            e.preventDefault();
        }

        // Start dragging clothing already on model (touch)
        function startDragClothingTouch(e) {
            isDragging = true;
            dragItem = e.target;
            dragItem.classList.add('dragging');
            
            e.preventDefault();
        }

        // Remove current item
        function removeCurrentItem() {
            removeItem(currentItemIndex);
        }

        // Remove item from model
        function removeItem(index) {
            // Find element on model and remove it
            const clothingElements = model.querySelectorAll('.clothing-item');
            clothingElements.forEach(element => {
                if (element.style.backgroundImage.includes(clothingItems[index].image)) {
                    element.remove();
                }
            });
            
            // Remove from worn items list
            wornItems = wornItems.filter(itemIndex => itemIndex !== index);
        }

        // Play pronunciation
        function playPronunciation(audioUrl) {
            // Stop previous pronunciation if playing
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Create new audio element
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = volumeSlider.value;
            pronunciationAudio.play();
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Create and play background music
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Show volume control
                volumeControl.classList.add('show');
            } else {
                // Stop music
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Hide volume control
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
            
            if (pronunciationAudio) {
                pronunciationAudio.volume = volume;
            }
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
