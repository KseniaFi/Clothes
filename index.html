    <meta charset="UTF-8">

    <title>Clothing Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #333;
            cursor: default;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            position: relative;
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .speaker-hint {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite, neonPulse 1.5s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .speaker-hint-second {
            position: absolute;
            top: -80px;
            left: 60%;
            transform: translateX(-50%);
            width: 35px;
            height: 35px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite reverse, neonPulse 1.8s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .flashcards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
            padding: 20px;
        }

        .card-counter {
            font-size: 18px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .card {
            width: 90%;
            max-width: 800px;
            height: 500px;
            perspective: 1000px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .card-front {
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: cover;
            color: white;
        }

        .card-back {
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: cover;
            transform: rotateY(180deg);
            color: white;
        }

        .card-image {
            width: 70%;
            height: 60%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .pair-image {
            background-size: 45%, 45%;
            background-position: 25% center, 75% center;
        }

        .card-name {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            padding: 10px 25px;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
        }

        .card-hint {
            position: absolute;
            bottom: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            font-family: 'Georgia', serif;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-flip {
            background: #9b59b6;
        }

        .btn-flip:hover {
            background: #8e44ad;
        }

        .btn-speak {
            background: #2ecc71;
        }

        .btn-speak:hover {
            background: #27ae60;
        }

        .btn-prev {
            background: #e67e22;
        }

        .btn-prev:hover {
            background: #d35400;
        }

        .btn-next {
            background: #e67e22;
        }

        .btn-next:hover {
            background: #d35400;
        }

        .progress-container {
            width: 90%;
            max-width: 800px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 5px;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s;
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .category-btn.active {
            background: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .study-mode {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
        }

        @keyframes bounceArrow {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-20px); 
            }
        }

        @keyframes neonPulse {
            from {
                filter: drop-shadow(0 0 5px silver) drop-shadow(0 0 10px silver);
            }
            to {
                filter: drop-shadow(0 0 10px silver) drop-shadow(0 0 20px silver) drop-shadow(0 0 30px silver);
            }
        }

        @keyframes cardFlip {
            0% { transform: rotateY(0); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(180deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .card {
                height: 400px;
            }
            
            .card-name {
                font-size: 24px;
                padding: 8px 20px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .card-image {
                width: 80%;
                height: 50%;
            }
            
            .flashcard-controls {
                gap: 10px;
            }
            
            .category-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .card {
                height: 350px;
            }
            
            .card-name {
                font-size: 20px;
                padding: 6px 15px;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 14px;
            }
            
            .card-image {
                width: 90%;
                height: 45%;
            }
            
            .card-counter {
                font-size: 14px;
            }
            
            .study-mode {
                font-size: 14px;
                padding: 8px 15px;
            }
        }

        @media (max-width: 360px) {
            .card {
                height: 300px;
            }
            
            .card-name {
                font-size: 18px;
            }
            
            .flashcard-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
                max-width: 90%;
            }
        }
    </style>
</head>

                name: "Over-the-knee socks",
                image: "pair",
                leftImage: "videos/1763744330.png",
                rightImage: "videos/1763744330(1).png",
                audio: "videos/J-20251125181431791Z.mp3",
                category: "legs"
            },
            {
                name: "Leggings",
                image: "videos/1763744197.png",
                audio: "videos/J-20251125181555194Z.mp3",
                category: "legs"
            },
            // Footwear (paired)
            {
                name: "Trainers [BrE] / Sneakers [AmE]",
                image: "pair",
                leftImage: "videos/IMG_20251123_151007_291(1).png",
                rightImage: "videos/IMG_20251123_151007_291.png",
                audio: "videos/J-20251125181731846Z.mp3",
                category: "feet"
            },
            {
                name: "Rain boots",
                image: "pair",
                leftImage: "videos/1763743394.png",
                rightImage: "videos/1763743394(1).png",
                audio: "videos/J-20251125181904099Z.mp3",
                category: "feet"
            },
            {
                name: "Thigh-high boots",
                image: "pair",
                leftImage: "videos/1763743296.png",
                rightImage: "videos/1763743296(1).png",
                audio: "videos/J-20251125183659959Z.mp3",
                category: "feet"
            },
            {
                name: "Heeled over-the-knee boots",
                image: "pair",
                leftImage: "videos/IMG_20251125_222515_088(1).png",
                rightImage: "videos/IMG_20251125_222515_088.png",
                audio: "videos/J-20251125184613900Z.mp3",
                category: "feet"
            },
            {
                name: "Heeled ankle boots",
                image: "pair",
                leftImage: "videos/IMG_20251128_003550_092.png",
                rightImage: "videos/IMG_20251128_003550_092(1).png",
                audio: "videos/J-20251125183935749Z.mp3",
                category: "feet"
            },
            {
                name: "Fluffy slippers",
                image: "pair",
                leftImage: "videos/1763743348.png",
                rightImage: "videos/1763743348(1).png",
                audio: "videos/J-20251125184120836Z.mp3",
                category: "feet"
            }
        ];

        // State variables
        let currentCardIndex = 0;
        let filteredItems = [...clothingItems];
        let currentCategory = "all";
        let backgroundMusic = null;
        let pronunciationAudio = null;
        let showSpeakerHint = true;

        // DOM elements
        const flashcard = document.getElementById('flashcard');
        const cardImageFront = document.getElementById('cardImageFront');
        const cardNameFront = document.getElementById('cardNameFront');
        const cardImageBack = document.getElementById('cardImageBack');
        const cardNameBack = document.getElementById('cardNameBack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const speakBtn = document.getElementById('speakBtn');
        const flipBtn = document.getElementById('flipBtn');
        const speaker = document.getElementById('speaker');
        const speakerHint = document.getElementById('speakerHint');
        const speakerHintSecond = document.getElementById('speakerHintSecond');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const cardCounter = document.getElementById('cardCounter');
        const progressBar = document.getElementById('progressBar');
        const categoryFilter = document.getElementById('categoryFilter');
        const studyMode = document.getElementById('studyMode');

        // Initialize
        function init() {
            displayCurrentCard();
            
            // Event handlers
            prevBtn.addEventListener('click', showPreviousCard);
            nextBtn.addEventListener('click', showNextCard);
            speakBtn.addEventListener('click', speakCurrentWord);
            flipBtn.addEventListener('click', flipCard);
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            flashcard.addEventListener('click', flipCard);
            
            // Keyboard navigation
            document.addEventListener('keydown', handleKeyPress);
            
            // Category filter
            categoryFilter.addEventListener('click', handleCategoryFilter);
            
            // Show speaker hints
            if (showSpeakerHint) {
                speakerHint.style.display = 'block';
                speakerHintSecond.style.display = 'block';
                setTimeout(() => {
                    speakerHint.style.display = 'none';
                    speakerHintSecond.style.display = 'none';
                    showSpeakerHint = false;
                }, 5000);
            }
            
            // Update progress
            updateProgress();
        }

        // Display current card
        function displayCurrentCard() {
            if (filteredItems.length === 0) {
                // No items in this category
                cardImageFront.style.backgroundImage = 'none';
                cardNameFront.textContent = "No items in this category";
                cardImageBack.style.backgroundImage = 'none';
                cardNameBack.textContent = "Select another category";
                return;
            }
            
            const item = filteredItems[currentCardIndex];
            
            // Set front of card
            if (item.image === "pair") {
                cardImageFront.style.backgroundImage = `url('${item.leftImage}'), url('${item.rightImage}')`;
                cardImageFront.classList.add('pair-image');
            } else {
                cardImageFront.style.backgroundImage = `url('${item.image}')`;
                cardImageFront.classList.remove('pair-image');
            }
            
            cardNameFront.textContent = item.name;
            
            // Set back of card
            if (item.image === "pair") {
                cardImageBack.style.backgroundImage = `url('${item.leftImage}'), url('${item.rightImage}')`;
                cardImageBack.classList.add('pair-image');
            } else {
                cardImageBack.style.backgroundImage = `url('${item.image}')`;
                cardImageBack.classList.remove('pair-image');
            }
            
            // On back, show name and category
            cardNameBack.textContent = `${item.name}\n(${getCategoryName(item.category)})`;
            
            // Update counter
            cardCounter.textContent = `Card ${currentCardIndex + 1} of ${filteredItems.length}`;
            
            // Auto-play pronunciation for new card
            playPronunciation(item.audio);
            
            // Update progress
            updateProgress();
        }

        // Get category display name
        function getCategoryName(category) {
            const categoryNames = {
                "head": "Headwear",
                "body": "Clothing",
                "legs": "Bottoms",
                "feet": "Footwear",
                "hands": "Handwear"
            };
            return categoryNames[category] || category;
        }

        // Show previous card
        function showPreviousCard() {
            if (filteredItems.length === 0) return;
            
            currentCardIndex = (currentCardIndex - 1 + filteredItems.length) % filteredItems.length;
            displayCurrentCard();
            
            // Ensure card is not flipped when changing
            flashcard.classList.remove('flipped');
        }

        // Show next card
        function showNextCard() {
            if (filteredItems.length === 0) return;
            
            currentCardIndex = (currentCardIndex + 1) % filteredItems.length;
            displayCurrentCard();
            
            // Ensure card is not flipped when changing
            flashcard.classList.remove('flipped');
        }

        // Flip card
        function flipCard() {
            flashcard.classList.toggle('flipped');
        }

        // Speak current word
        function speakCurrentWord() {
            if (filteredItems.length === 0) return;
            
            const item = filteredItems[currentCardIndex];
            playPronunciation(item.audio);
        }

        // Handle category filter
        function handleCategoryFilter(event) {
            if (event.target.classList.contains('category-btn')) {
                // Update active button
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
                
                // Get category
                currentCategory = event.target.dataset.category;
                
                // Filter items
                if (currentCategory === "all") {
                    filteredItems = [...clothingItems];
                } else {
                    filteredItems = clothingItems.filter(item => item.category === currentCategory);
                }
                
                // Reset to first card
                currentCardIndex = 0;
                displayCurrentCard();
                
                // Update study mode hint
                if (filteredItems.length > 0) {
                    studyMode.textContent = `Click card to flip | ${filteredItems.length} items in this category`;
                } else {
                    studyMode.textContent = "No items in this category";
                }
            }
        }

        // Handle keyboard navigation
        function handleKeyPress(event) {
            switch(event.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    showPreviousCard();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    showNextCard();
                    break;
                case ' ':
                case 'Enter':
                    event.preventDefault();
                    flipCard();
                    break;
                case 's':
                case 'S':
                    speakCurrentWord();
                    break;
            }
        }

        // Update progress bar
        function updateProgress() {
            if (filteredItems.length === 0) {
                progressBar.style.width = '0%';
                return;
            }
            
            const progress = ((currentCardIndex + 1) / filteredItems.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // Play pronunciation
        function playPronunciation(audioUrl) {
            // Stop previous pronunciation if playing
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Create new audio element with higher volume
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = Math.min(volumeSlider.value * 1.5, 1.0);
            
            pronunciationAudio.play();
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Create and play background music
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Add playing class to speaker for animation
                speaker.classList.add('playing');
                
                // Show volume control
                volumeControl.classList.add('show');
            } else {
                // Stop music
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Remove playing class from speaker
                speaker.classList.remove('playing');
                
                // Hide volume control
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
