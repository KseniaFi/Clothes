<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Matching Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            color: #fff;
        }
        
        .audio-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: rgba(255, 117, 24, 0.9);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #ff8c00;
        }
        
        .audio-icon {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .audio-icon:hover {
            transform: scale(1.1);
        }
        
        .clothing-audio {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: rgba(0, 200, 255, 0.9);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #00aaff;
        }
        
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .volume-slider {
            width: 80px;
            cursor: pointer;
        }
        
        .game-container {
            display: flex;
            justify-content: space-between;
            width: 95%;
            max-width: 1400px;
            margin-bottom: 30px;
            gap: 30px;
            margin-top: 80px;
        }
        
        .images-container, .phrases-container {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .item {
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
            border: 4px solid transparent;
        }
        
        /* Square cells for images */
        .image-item {
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            padding: 10px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.1);
            width: 100%;
            height: 200px;
        }
        
        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-color: #00aaff;
        }
        
        .phrase-item {
            background-color: rgba(0, 100, 200, 0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            min-height: 120px;
            padding: 20px;
        }
        
        .phrase-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-color: #00ffaa;
        }
        
        .image-item.selected {
            border-color: #00aaff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.7);
        }
        
        .phrase-item.selected {
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.7);
        }
        
        .image-item.correct {
            border-color: #2ecc71;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.8);
        }
        
        .phrase-item.correct {
            border-color: #9b59b6;
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.8);
        }
        
        .image-item.incorrect, .phrase-item.incorrect {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.7);
            animation: shake 0.5s;
        }
        
        /* Animation for disappearing elements */
        .image-item.disappear, .phrase-item.disappear {
            animation: disappear 1.5s forwards;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        @keyframes disappear {
            0% { 
                opacity: 1;
                transform: scale(1);
            }
            70% {
                opacity: 1;
                transform: scale(1);
            }
            100% { 
                opacity: 0;
                transform: scale(0);
                display: none;
            }
        }
        
        /* Image adaptation */
        .image-item img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 10px;
        }
        
        .phrase-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .phrase-item p {
            font-size: 1.2rem;
            margin: 0;
            text-align: center;
            color: white;
            width: 100%;
            line-height: 1.4;
            font-weight: bold;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }
        
        .audio-icon-small {
            width: 25px;
            height: 25px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 3px #ff9900);
        }
        
        .audio-icon-small:hover {
            transform: scale(1.1);
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        
        button:hover {
            background: linear-gradient(135deg, #e65a5a, #e63939);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        
        .completion-message {
            font-size: 2.5rem;
            color: #00ffaa;
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .score-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffea;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #00aaff;
        }
        
        /* Feedback overlay */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 30, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }
        
        .feedback-content {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        .feedback-title {
            font-size: 4.5rem;
            margin-bottom: 40px;
            text-shadow: 0 0 25px;
        }
        
        .feedback-title.correct {
            color: #00ff00;
            text-shadow: 0 0 25px #00ff00;
        }
        
        .feedback-title.incorrect {
            color: #ff0000;
            text-shadow: 0 0 25px #ff0000;
        }
        
        .feedback-image-container {
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .feedback-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
        }
        
        .feedback-paired-images {
            display: flex;
            gap: 40px;
        }
        
        .feedback-paired-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
        }
        
        .feedback-text {
            font-size: 3rem;
            margin-top: 30px;
            text-shadow: 0 0 20px;
        }
        
        .correct-image {
            filter: drop-shadow(0 0 25px #00ff00);
        }
        
        .incorrect-image {
            filter: drop-shadow(0 0 25px #ff0000);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        /* Tablet responsiveness */
        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
                gap: 30px;
                margin-top: 60px;
            }
            
            .images-container, .phrases-container {
                width: 100%;
            }
            
            .image-item {
                height: 180px;
            }
            
            .item {
                min-height: 110px;
            }
            
            .phrase-item {
                min-height: 110px;
            }
            
            .audio-player, .clothing-audio {
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                margin: 10px;
                width: 90%;
                justify-content: center;
            }
            
            .score-display {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 10px auto;
                width: 90%;
                text-align: center;
            }
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .game-container {
                margin-top: 20px;
                gap: 20px;
            }
            
            .item {
                min-height: 100px;
                padding: 15px;
            }
            
            .phrase-item {
                min-height: 100px;
                padding: 15px;
            }
            
            .phrase-item p {
                font-size: 1.1rem;
            }
            
            .image-item {
                height: 160px;
            }
            
            .images-container, .phrases-container {
                gap: 15px;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1.1rem;
            }
            
            .completion-message {
                font-size: 1.8rem;
            }
            
            .feedback-title {
                font-size: 3rem;
            }
            
            .feedback-image, .feedback-paired-image {
                width: 120px;
                height: 120px;
            }
            
            .feedback-text {
                font-size: 2rem;
            }
        }
        
        /* Small screen responsiveness */
        @media (max-width: 480px) {
            .game-container {
                margin-top: 10px;
                gap: 15px;
            }
            
            .item {
                min-height: 90px;
                padding: 10px;
                flex-direction: column;
                text-align: center;
            }
            
            .phrase-item {
                min-height: 90px;
                padding: 10px;
            }
            
            .phrase-item p {
                font-size: 1rem;
            }
            
            .phrase-content {
                flex-direction: row;
                justify-content: space-between;
                width: 100%;
            }
            
            .image-item {
                height: 140px;
            }
            
            .images-container, .phrases-container {
                gap: 12px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
                width: 100%;
                max-width: 200px;
            }
            
            .completion-message {
                font-size: 1.5rem;
                margin-top: 10px;
            }
            
            .controls {
                margin-top: 15px;
                gap: 10px;
            }
            
            .score-display {
                font-size: 1.2rem;
                padding: 8px 15px;
            }
        }
        
        /* High-resolution displays */
        @media (min-width: 1400px) {
            .game-container {
                max-width: 1600px;
            }
            
            .image-item {
                height: 220px;
            }
            
            .phrase-item {
                min-height: 140px;
                padding: 25px;
            }
            
            .phrase-item p {
                font-size: 1.4rem;
            }
            
            button {
                font-size: 1.5rem;
                padding: 18px 35px;
            }
        }
    </style>
</head>

            { id: 47, name: "Heeled over-the-knee boots", image: "videos/IMG_20251125_222515_088.png", audio: "videos/J-20251125184613900Z.mp3", isPair: true,
              images: { left: "videos/IMG_20251125_222515_088(1).png", right: "videos/IMG_20251125_222515_088.png" } },
            { id: 48, name: "Heeled ankle boots", image: "videos/IMG_20251128_003550_092.png", audio: "videos/J-20251125183935749Z.mp3", isPair: true,
              images: { left: "videos/IMG_20251128_003550_092.png", right: "videos/IMG_20251128_003550_092(1).png" } },
            { id: 49, name: "Fluffy slippers", image: "videos/1763743348.png", audio: "videos/J-20251125184120836Z.mp3", isPair: true,
              images: { left: "videos/1763743348.png", right: "videos/1763743348(1).png" } },
            
            // Handwear
            { id: 50, name: "Mittens", image: "videos/IMG_20251128_151203_478.png", audio: "videos/J-20251128111553821Z.mp3", isPair: true,
              images: { left: "videos/IMG_20251128_151216_098.png", right: "videos/IMG_20251128_151203_478.png" } },
            { id: 51, name: "Gloves", image: "videos/IMG_20251128_150512_784.png", audio: "videos/J-20251128112340450Z.mp3", isPair: true,
              images: { left: "videos/IMG_20251128_150512_784.png", right: "videos/IMG_20251128_150950_624.png" } }
        ];

        // Game state variables
        let selectedImage = null;
        let selectedPhrase = null;
        let matchedPairs = [];
        let score = 0;
        let matches = 0;

        // Audio elements
        const backgroundAudio = document.getElementById('background-audio');
        const audioToggle = document.getElementById('audio-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        const clothingAudioToggle = document.getElementById('clothing-audio-toggle');
        const clothingVolumeSlider = document.getElementById('clothing-volume-slider');
        
        // Feedback overlay elements
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackImageContainer = document.getElementById('feedback-image-container');
        const feedbackText = document.getElementById('feedback-text');

        // Initialize audio
        function initAudio() {
            // Set initial volume
            backgroundAudio.volume = volumeSlider.value;
            
            // Toggle background audio play/pause
            audioToggle.addEventListener('click', function() {
                if (backgroundAudio.paused) {
                    backgroundAudio.play();
                } else {
                    backgroundAudio.pause();
                }
            });
            
            // Update background audio volume when slider changes
            volumeSlider.addEventListener('input', function() {
                backgroundAudio.volume = this.value;
            });
            
            // Handle background audio loading errors
            backgroundAudio.addEventListener('error', function() {
                console.error('Error loading background audio file');
            });
            
            // Toggle clothing audio (play random clothing audio)
            clothingAudioToggle.addEventListener('click', function() {
                const randomItem = gameData[Math.floor(Math.random() * gameData.length)];
                playClothingAudio(randomItem.audio);
            });
            
            // Update clothing audio volume when slider changes
            clothingVolumeSlider.addEventListener('input', function() {
                // This slider controls the volume for individual clothing audio
                // The volume is applied when each audio is played
            });
        }

        // Play clothing audio
        function playClothingAudio(url, callback) {
            const audio = new Audio(url);
            audio.volume = clothingVolumeSlider.value;
            
            audio.addEventListener('error', function() {
                console.error('Error loading clothing audio file:', url);
            });
            
            if (callback) {
                audio.addEventListener('ended', callback);
            }
            
            audio.play().catch(error => {
                console.error('Audio playback failed:', error);
            });
            
            return audio;
        }

        // Initialize game
        function initGame() {
            const imagesContainer = document.getElementById('images-container');
            const phrasesContainer = document.getElementById('phrases-container');
            const scoreDisplay = document.getElementById('score-display');
            
            // Clear containers
            imagesContainer.innerHTML = '';
            phrasesContainer.innerHTML = '';
            
            // Reset state
            selectedImage = null;
            selectedPhrase = null;
            matchedPairs = [];
            score = 0;
            matches = 0;
            
            // Update score display
            scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
            
            // Hide completion message
            document.getElementById('completion-message').style.opacity = '0';
            
            // Hide feedback overlay
            feedbackOverlay.style.display = 'none';
            
            // Images in correct order
            gameData.forEach((item, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'item image-item';
                imageItem.dataset.id = item.id;
                imageItem.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                
                // Add error handling for images
                img.onerror = function() {
                    console.warn(`Failed to load image: ${item.image}`);
                };
                
                imageItem.appendChild(img);
                imagesContainer.appendChild(imageItem);
                
                // Click handler for image
                imageItem.addEventListener('click', () => handleImageClick(index));
            });
            
            // Phrases in random order
            const shuffledPhrases = [...gameData].sort(() => Math.random() - 0.5);
            
            shuffledPhrases.forEach((item, index) => {
                const phraseItem = document.createElement('div');
                phraseItem.className = 'item phrase-item';
                phraseItem.dataset.id = item.id;
                phraseItem.dataset.index = index;
                phraseItem.dataset.originalIndex = gameData.findIndex(g => g.id === item.id);
                
                const phraseContent = document.createElement('div');
                phraseContent.className = 'phrase-content';
                
                const p = document.createElement('p');
                p.textContent = item.name;
                
                const audioIcon = document.createElement('img');
                audioIcon.src = 'videos/IMG_20251124_151845_148.png';
                audioIcon.className = 'audio-icon-small';
                audioIcon.title = 'Listen to pronunciation';
                audioIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playClothingAudio(item.audio);
                });
                
                phraseContent.appendChild(p);
                phraseContent.appendChild(audioIcon);
                phraseItem.appendChild(phraseContent);
                phrasesContainer.appendChild(phraseItem);
                
                // Click handler for phrase
                phraseItem.addEventListener('click', () => handlePhraseClick(index));
            });
        }

        // Image click handler
        function handleImageClick(index) {
            // Ignore clicks if game is completed
            if (matchedPairs.length === gameData.length * 2) return;
            
            const imageItems = document.querySelectorAll('.image-item');
            const clickedItem = imageItems[index];
            const itemId = parseInt(clickedItem.dataset.id);
            
            // Ignore if image is already matched
            if (matchedPairs.includes(itemId)) return;
            
            // Deselect other images
            imageItems.forEach(item => {
                const id = parseInt(item.dataset.id);
                if (item !== clickedItem && !matchedPairs.includes(id)) {
                    item.classList.remove('selected');
                }
            });
            
            // If clicking already selected image, deselect it
            if (selectedImage === index) {
                clickedItem.classList.remove('selected');
                selectedImage = null;
            } else {
                // Select new image
                clickedItem.classList.add('selected');
                selectedImage = index;
                
                // If phrase is already selected, check match
                if (selectedPhrase !== null) {
                    checkMatch();
                }
            }
        }

        // Phrase click handler
        function handlePhraseClick(index) {
            // Ignore clicks if game is completed
            if (matchedPairs.length === gameData.length * 2) return;
            
            const phraseItems = document.querySelectorAll('.phrase-item');
            const clickedItem = phraseItems[index];
            const itemId = parseInt(clickedItem.dataset.id);
            
            // Ignore if phrase is already matched
            if (matchedPairs.includes(itemId)) return;
            
            // Deselect other phrases
            phraseItems.forEach(item => {
                const id = parseInt(item.dataset.id);
                if (item !== clickedItem && !matchedPairs.includes(id)) {
                    item.classList.remove('selected');
                }
            });
            
            // If clicking already selected phrase, deselect it
            if (selectedPhrase === index) {
                clickedItem.classList.remove('selected');
                selectedPhrase = null;
            } else {
                // Select new phrase
                clickedItem.classList.add('selected');
                selectedPhrase = index;
                
                // If image is already selected, check match
                if (selectedImage !== null) {
                    checkMatch();
                }
            }
        }

        // Check if selected image and phrase match
        function checkMatch() {
            const imageItems = document.querySelectorAll('.image-item');
            const phraseItems = document.querySelectorAll('.phrase-item');
            const scoreDisplay = document.getElementById('score-display');
            
            const selectedImageItem = imageItems[selectedImage];
            const selectedPhraseItem = phraseItems[selectedPhrase];
            
            const imageId = parseInt(selectedImageItem.dataset.id);
            const phraseId = parseInt(selectedPhraseItem.dataset.id);
            
            if (imageId === phraseId) {
                // Correct match
                score += 10;
                matches++;
                scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
                
                selectedImageItem.classList.remove('selected');
                selectedImageItem.classList.add('correct');
                
                selectedPhraseItem.classList.remove('selected');
                selectedPhraseItem.classList.add('correct');
                
                // Add to matched pairs list
                matchedPairs.push(imageId);
                
                // Show correct feedback
                const item = gameData.find(item => item.id === imageId);
                showFeedback(true, item);
                
                // After 5 seconds, make the matched elements disappear
                setTimeout(() => {
                    selectedImageItem.classList.add('disappear');
                    selectedPhraseItem.classList.add('disappear');
                }, 5000);
                
                // Check if game is completed
                if (matchedPairs.length === gameData.length) {
                    setTimeout(() => {
                        document.getElementById('completion-message').style.opacity = '1';
                    }, 6000);
                }
            } else {
                // Incorrect match
                score = Math.max(0, score - 5);
                scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
                
                // Get the item for feedback
                const imageItem = gameData.find(item => item.id === imageId);
                const phraseItem = gameData.find(item => item.id === phraseId);
                
                // Show incorrect feedback with the image that was clicked
                showFeedback(false, phraseItem);
                
                // Highlight incorrect
                selectedImageItem.classList.add('incorrect');
                selectedPhraseItem.classList.add('incorrect');
                
                // Reset selection after 3 seconds
                setTimeout(() => {
                    selectedImageItem.classList.remove('selected', 'incorrect');
                    selectedPhraseItem.classList.remove('selected', 'incorrect');
                }, 3000);
            }
            
            // Reset selected elements
            selectedImage = null;
            selectedPhrase = null;
        }

        // Show feedback overlay
        function showFeedback(isCorrect, item) {
            if (!item) return;
            
            feedbackImageContainer.innerHTML = '';
            
            if (isCorrect) {
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "feedback-title correct";
                feedbackText.textContent = `${item.name} ✓`;
                feedbackText.style.color = "#00ff00";
                
                if (item.isPair) {
                    // Show both images for paired items
                    const pairedContainer = document.createElement('div');
                    pairedContainer.className = 'feedback-paired-images';
                    
                    const leftImg = document.createElement('img');
                    leftImg.src = item.images.left;
                    leftImg.alt = item.name;
                    leftImg.className = 'feedback-paired-image correct-image';
                    
                    const rightImg = document.createElement('img');
                    rightImg.src = item.images.right;
                    rightImg.alt = item.name;
                    rightImg.className = 'feedback-paired-image correct-image';
                    
                    pairedContainer.appendChild(leftImg);
                    pairedContainer.appendChild(rightImg);
                    feedbackImageContainer.appendChild(pairedContainer);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image correct-image';
                    feedbackImageContainer.appendChild(img);
                }
                
                // Play pronunciation
                playClothingAudio(item.audio);
            } else {
                feedbackTitle.textContent = "Try Again!";
                feedbackTitle.className = "feedback-title incorrect";
                feedbackText.textContent = `${item.name} ✗`;
                feedbackText.style.color = "#ff0000";
                
                if (item.isPair) {
                    // Show left image for paired items
                    const img = document.createElement('img');
                    img.src = item.images ? item.images.left : item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                }
            }
            
            feedbackOverlay.style.display = "flex";
            
            // Hide overlay after delay
            const hideDelay = isCorrect ? 5000 : 3000;
            setTimeout(() => {
                feedbackOverlay.style.display = "none";
            }, hideDelay);
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
            initAudio();
            
            // Handler for reset button
            document.getElementById('reset-btn').addEventListener('click', initGame);
        });
    </script>
</body>
