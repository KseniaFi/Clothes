<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одежда: Игры и Упражнения</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Затемнение фона для лучшей читаемости */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        
        /* Контейнер для фейерверка */
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Контейнер для летающей одежды */
        #flying-clothes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .clothing-item {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.7));
            transition: filter 0.5s ease;
            z-index: 2;
        }
        
        .clothing-item.green-glow {
            filter: drop-shadow(0 0 8px rgba(50, 205, 50, 0.7));
        }
        
        /* Основной контейнер меню */
        .menu-container {
            position: relative;
            z-index: 3;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Заголовок */
        .header {
            text-align: center;
            margin: 40px 0 60px;
            padding: 20px;
            background: rgba(75, 0, 130, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(147, 112, 219, 0.8);
            backdrop-filter: blur(5px);
            max-width: 90%;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(147, 112, 219, 0.9);
            background: linear-gradient(to right, #9b30ff, #00ff7f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Контейнер меню */
        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
        }
        
        /* Пункты меню */
        .menu-item {
            background: rgba(75, 0, 130, 0.75);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(147, 112, 219, 0.5);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
            min-height: 180px;
        }
        
        .menu-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            background: rgba(106, 13, 173, 0.85);
            border-color: rgba(147, 112, 219, 1);
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }
        
        .menu-item:hover::before {
            left: 100%;
        }
        
        .menu-item i {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #9b30ff;
            text-shadow: 0 0 10px rgba(155, 48, 255, 0.7);
        }
        
        .menu-item:hover i {
            color: #00ff7f;
            text-shadow: 0 0 15px rgba(0, 255, 127, 0.9);
        }
        
        .menu-item h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        
        .menu-item p {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        /* Футер */
        .footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            width: 100%;
        }
        
        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            .menu {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 500px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .header {
                margin: 20px 0 40px;
                padding: 15px;
            }
            
            .menu-item {
                padding: 25px 15px;
                min-height: 150px;
            }
            
            .menu-item h2 {
                font-size: 1.3rem;
            }
            
            .clothing-item {
                width: 30px;
                height: 30px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.7rem;
            }
            
            .menu-item {
                padding: 20px 15px;
            }
            
            .menu-item i {
                font-size: 2.2rem;
                margin-bottom: 15px;
            }
            
            .clothing-item {
                width: 25px;
                height: 25px;
            }
        }
        
        /* Анимация мерцания для заголовка */
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(147, 112, 219, 0.9); }
            50% { text-shadow: 0 0 20px rgba(147, 112, 219, 1), 0 0 30px rgba(0, 255, 127, 0.7); }
        }
        
        .header h1 {
            animation: glow 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <!-- Контейнер для фейерверка -->
    <div id="fireworks-container"></div>
    
    <!-- Контейнер для летающей одежды -->
    <div id="flying-clothes"></div>
    
    <!-- Основной контейнер меню -->
    <div class="menu-container">
        <header class="header">
            <h1><i class="fas fa-tshirt"></i>Clothes Vocabulary</h1>
        
        </header>
        
        <div class="menu">
            <a href="Clothes%20Flashcards.html" class="menu-item">
                <i class="fas fa-id-card"></i>
                <h2>Clothes Flashcards</h2>
                
            </a>
            
            <a href="Dress%20Up%20Game.html" class="menu-item">
                <i class="fas fa-user-tie"></i>
                <h2>Dress‑Up Game</h2>
            
            </a>
            
            <a href="Clothes%20Matching%20Game.html" class="menu-item">
                <i class="fas fa-puzzle-piece"></i>
                <h2>Clothes Matching Game</h2>
                
            </a>
            
            <a href="Clothes%20Listening%20Game.html" class="menu-item">
                <i class="fas fa-headphones"></i>
                <h2>Clothes Listening Game</h2>
                
            </a>
        </div>
        
        
    
    </div>

    <script>
        // Массив с путями к изображениям одежды
        const clothingImages = [
            {path: 'videos/IMG_20251122_212926_250.png', glow: 'purple'}, // Fur bucket hat
            {path: 'videos/IMG_20251122_212441_090.png', glow: 'purple'}, // Santa hat
            {path: 'videos/IMG_20251121_222742_175.png', glow: 'green'}, // Bobble beanie
            {path: 'videos/IMG_20251121_212828_849.png', glow: 'green'}, // Sweatshirt
            {path: 'videos/1763742036.png', glow: 'purple'}, // Trousers
            {path: 'videos/1763741462.png', glow: 'green'} // T-shirt
        ];
        
        // Контейнер для летающей одежды
        const flyingClothesContainer = document.getElementById('flying-clothes');
        
        // Создание летающих изображений одежды
        function createFlyingClothes() {
            // Количество элементов одежды (зависит от размера экрана)
            const clothesCount = window.innerWidth < 768 ? 10 : 15;
            
            for (let i = 0; i < clothesCount; i++) {
                // Выбираем случайное изображение одежды
                const clothing = clothingImages[Math.floor(Math.random() * clothingImages.length)];
                
                // Создаем элемент изображения
                const img = document.createElement('img');
                img.src = clothing.path;
                img.classList.add('clothing-item');
                if (clothing.glow === 'green') {
                    img.classList.add('green-glow');
                }
                
                // Устанавливаем случайные начальные позиции и параметры анимации
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;
                const duration = 15 + Math.random() * 25; // Длительность анимации
                const delay = Math.random() * 5; // Задержка начала анимации
                const scale = 0.5 + Math.random() * 0.7; // Масштаб
                
                // Применяем стили для анимации
                img.style.left = `${startX}%`;
                img.style.top = `${startY}%`;
                img.style.width = `${40 * scale}px`;
                img.style.height = `${40 * scale}px`;
                img.style.animation = `flyAround ${duration}s linear ${delay}s infinite`;
                
                // Случайное направление анимации
                const direction = Math.random() > 0.5 ? 'normal' : 'reverse';
                img.style.animationDirection = direction;
                
                // Добавляем элемент в контейнер
                flyingClothesContainer.appendChild(img);
            }
        }
        
        // Создаем CSS для анимации летающей одежды
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes flyAround {
                0% {
                    transform: translate(0, 0) rotate(0deg);
                }
                10% {
                    transform: translate(20px, 50px) rotate(36deg);
                }
                20% {
                    transform: translate(-30px, 100px) rotate(72deg);
                }
                30% {
                    transform: translate(50px, 150px) rotate(108deg);
                }
                40% {
                    transform: translate(-20px, 200px) rotate(144deg);
                }
                50% {
                    transform: translate(30px, 150px) rotate(180deg);
                }
                60% {
                    transform: translate(-50px, 100px) rotate(216deg);
                }
                70% {
                    transform: translate(20px, 50px) rotate(252deg);
                }
                80% {
                    transform: translate(-30px, 0) rotate(288deg);
                }
                90% {
                    transform: translate(40px, -50px) rotate(324deg);
                }
                100% {
                    transform: translate(0, 0) rotate(360deg);
                }
            }
        `;
        document.head.appendChild(styleSheet);
        
        // Функция для создания фейерверка
        function createFireworks() {
            const container = document.getElementById('fireworks-container');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            container.appendChild(canvas);
            
            // Частицы фейерверка
            const particles = [];
            const colors = ['#9b30ff', '#00ff7f', '#ff00ff', '#00ffff', '#ffff00'];
            
            // Создание частицы
            function createParticle(x, y) {
                return {
                    x: x,
                    y: y,
                    size: Math.random() * 3 + 1,
                    speedX: Math.random() * 6 - 3,
                    speedY: Math.random() * 6 - 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                };
            }
            
            // Создание фейерверка
            function createFirework(x, y) {
                const particleCount = 80;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(createParticle(x, y));
                }
            }
            
            // Анимация фейерверка
            function animateFireworks() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Создаем случайные фейерверки
                if (Math.random() < 0.05) {
                    createFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height * 0.5
                    );
                }
                
                // Обновляем и отрисовываем частицы
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    
                    // Обновляем позицию
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.life--;
                    
                    // Рисуем частицу
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    // Удаляем "мертвые" частицы
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        i--;
                    }
                }
                
                requestAnimationFrame(animateFireworks);
            }
            
            // Запуск анимации фейерверка
            animateFireworks();
            
            // Обработка изменения размера окна
            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
        
        // Инициализация при загрузке страницы
        window.onload = function() {
            createFlyingClothes();
            createFireworks();
            
            // Добавляем обработчик изменения размера окна для пересоздания летающих элементов
            window.addEventListener('resize', function() {
                // Удаляем старые элементы
                while (flyingClothesContainer.firstChild) {
                    flyingClothesContainer.removeChild(flyingClothesContainer.firstChild);
                }
                // Создаем новые с учетом нового размера экрана
                createFlyingClothes();
            });
        };
    </script>
</body>
</html>
