<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Matching Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Оранжевое свечение для элементов */
        @keyframes orangeGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 117, 24, 0.7),
                           0 0 20px rgba(255, 117, 24, 0.5),
                           0 0 30px rgba(255, 117, 24, 0.3);
            }
            50% {
                box-shadow: 0 0 15px rgba(255, 117, 24, 0.9),
                           0 0 30px rgba(255, 117, 24, 0.7),
                           0 0 45px rgba(255, 117, 24, 0.5);
            }
        }
        
        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 0 10px #ff7518,
                           0 0 20px #ff7518,
                           0 0 30px #ff7518;
            }
            50% {
                text-shadow: 0 0 15px #ff7518,
                           0 0 30px #ff7518,
                           0 0 45px #ff7518;
            }
        }
        
        .audio-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: rgba(255, 117, 24, 0.9);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #ff8c00;
            animation: orangeGlow 2s infinite alternate;
        }
        
        .audio-icon {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .audio-icon:hover {
            transform: scale(1.1);
        }
        
        .clothing-audio {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: rgba(255, 117, 24, 0.9);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #ff8c00;
            animation: orangeGlow 2s infinite alternate;
        }
        
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .volume-slider {
            width: 80px;
            cursor: pointer;
        }
        
        .game-container {
            display: flex;
            justify-content: space-between;
            width: 95%;
            max-width: 1400px;
            margin-bottom: 30px;
            gap: 30px;
            margin-top: 80px;
        }
        
        .images-container, .phrases-container {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* Скрытие колонки с произношением в начале */
        .phrases-container.hidden {
            display: none;
        }
        
        .item {
            border-radius: 50%;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            animation: orangeGlow 3s infinite alternate;
        }
        
        /* Кружки для изображений */
        .image-item {
            width: 180px;
            height: 180px;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        
        .image-item:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #ff7518;
        }
        
        /* Кружки для текста с фоновым изображением */
        .phrase-item {
            width: 100%;
            min-height: 120px;
            background: url('videos/IMG_20251128_230412_184.jpg') no-repeat center center;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 20px;
            padding: 20px;
            border: 3px solid #ff7518;
            position: relative;
        }
        
        .phrase-item:hover {
            transform: translateY(-5px);
            border-color: #ff8c00;
        }
        
        .image-item.selected {
            border-color: #ff7518;
            box-shadow: 0 0 25px rgba(255, 117, 24, 0.9);
        }
        
        .phrase-item.selected {
            border-color: #ff8c00;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.9);
        }
        
        .image-item.correct {
            border-color: #2ecc71;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.9);
        }
        
        .phrase-item.correct {
            border-color: #2ecc71;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.9);
        }
        
        .image-item.incorrect, .phrase-item.incorrect {
            border-color: #e74c3c;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.9);
            animation: shake 0.5s;
        }
        
        /* Анимация исчезновения элементов */
        .image-item.disappear, .phrase-item.disappear {
            animation: disappear 1.5s forwards;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        @keyframes disappear {
            0% { 
                opacity: 1;
                transform: scale(1);
            }
            70% {
                opacity: 1;
                transform: scale(1);
            }
            100% { 
                opacity: 0;
                transform: scale(0);
                display: none;
            }
        }
        
        /* Изображения в кружках */
        .image-item img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 50%;
        }
        
        .phrase-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .phrase-item p {
            font-size: 1.3rem;
            margin: 0;
            text-align: center;
            color: white;
            width: 100%;
            line-height: 1.4;
            font-weight: bold;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            animation: textGlow 2s infinite alternate;
        }
        
        .audio-icon-small {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 5px #ff9900);
        }
        
        .audio-icon-small:hover {
            transform: scale(1.1);
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: linear-gradient(135deg, #ff7518, #ff8c00);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-weight: bold;
            animation: orangeGlow 2s infinite alternate;
        }
        
        button:hover {
            background: linear-gradient(135deg, #e65c00, #e67300);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        
        .completion-message {
            font-size: 2.5rem;
            color: #ff7518;
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: textGlow 3s infinite alternate;
        }
        
        .score-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 117, 24, 0.9);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #ff8c00;
            animation: orangeGlow 2s infinite alternate;
        }
        
        /* Feedback overlay */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 30, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }
        
        .feedback-content {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        .feedback-title {
            font-size: 4.5rem;
            margin-bottom: 40px;
            text-shadow: 0 0 25px;
            animation: textGlow 2s infinite alternate;
        }
        
        .feedback-title.correct {
            color: #00ff00;
            text-shadow: 0 0 25px #00ff00;
        }
        
        .feedback-title.incorrect {
            color: #ff0000;
            text-shadow: 0 0 25px #ff0000;
        }
        
        .feedback-image-container {
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .feedback-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
            border: 3px solid;
        }
        
        .feedback-paired-images {
            display: flex;
            gap: 40px;
        }
        
        .feedback-paired-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 25px);
            animation: float 3s ease-in-out infinite;
            border: 3px solid;
        }
        
        .feedback-text {
            font-size: 2.5rem;
            margin-top: 30px;
            text-shadow: 0 0 20px;
            animation: textGlow 2s infinite alternate;
        }
        
        .correct-image {
            border-color: #00ff00;
            filter: drop-shadow(0 0 25px #00ff00);
        }
        
        .incorrect-image {
            border-color: #ff0000;
            filter: drop-shadow(0 0 25px #ff0000);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        /* Анимация салюта */
        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        
        /* Адаптация для планшетов */
        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
                gap: 30px;
                margin-top: 100px;
            }
            
            .images-container, .phrases-container {
                width: 100%;
            }
            
            .image-item {
                width: 160px;
                height: 160px;
            }
            
            .phrase-item {
                min-height: 110px;
                padding: 18px;
            }
            
            .phrase-item p {
                font-size: 1.2rem;
            }
            
            .audio-player, .clothing-audio {
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                margin: 10px auto;
                width: 90%;
                justify-content: center;
            }
            
            .score-display {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 10px auto;
                width: 90%;
                text-align: center;
                order: -1;
            }
        }
        
        /* Адаптация для мобильных телефонов */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .game-container {
                margin-top: 120px;
                gap: 20px;
            }
            
            .image-item {
                width: 140px;
                height: 140px;
            }
            
            .phrase-item {
                min-height: 100px;
                padding: 15px;
                border-radius: 15px;
            }
            
            .phrase-item p {
                font-size: 1.1rem;
            }
            
            .images-container, .phrases-container {
                gap: 20px;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1.1rem;
            }
            
            .completion-message {
                font-size: 1.8rem;
            }
            
            .feedback-title {
                font-size: 3rem;
            }
            
            .feedback-image {
                width: 150px;
                height: 150px;
            }
            
            .feedback-paired-image {
                width: 120px;
                height: 120px;
            }
            
            .feedback-text {
                font-size: 1.8rem;
            }
            
            .score-display {
                font-size: 1.3rem;
                padding: 10px 20px;
            }
        }
        
        /* Маленькие экраны */
        @media (max-width: 480px) {
            .game-container {
                margin-top: 140px;
                gap: 15px;
            }
            
            .item {
                padding: 12px;
            }
            
            .image-item {
                width: 120px;
                height: 120px;
            }
            
            .phrase-item {
                min-height: 90px;
                padding: 12px;
                border-radius: 12px;
            }
            
            .phrase-item p {
                font-size: 1rem;
            }
            
            .phrase-content {
                gap: 10px;
            }
            
            .images-container, .phrases-container {
                gap: 15px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
                width: 100%;
                max-width: 200px;
            }
            
            .completion-message {
                font-size: 1.5rem;
                margin-top: 10px;
            }
            
            .controls {
                margin-top: 15px;
                gap: 10px;
            }
            
            .score-display {
                font-size: 1.1rem;
                padding: 8px 15px;
            }
            
            .audio-icon-small {
                width: 25px;
                height: 25px;
            }
        }
        
        /* Очень маленькие экраны */
        @media (max-width: 360px) {
            .image-item {
                width: 110px;
                height: 110px;
            }
            
            .phrase-item {
                min-height: 85px;
                padding: 10px;
            }
            
            .phrase-item p {
                font-size: 0.95rem;
            }
            
            .score-display {
                font-size: 1rem;
                padding: 6px 12px;
            }
            
            button {
                font-size: 0.9rem;
                padding: 8px 16px;
            }
        }
        
        /* Ландшафтная ориентация для мобильных */
        @media (max-height: 500px) and (orientation: landscape) {
            .game-container {
                flex-direction: row;
                margin-top: 80px;
            }
            
            .images-container, .phrases-container {
                width: 48%;
            }
            
            .image-item {
                width: 100px;
                height: 100px;
            }
            
            .phrase-item {
                min-height: 80px;
                padding: 10px;
            }
            
            .phrase-item p {
                font-size: 0.9rem;
            }
            
            .audio-player, .clothing-audio {
                position: fixed;
                top: 10px;
                right: 10px;
                width: auto;
            }
            
            .clothing-audio {
                left: 10px;
            }
            
            .score-display {
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
            }
        }
        
        /* Высокое разрешение */
        @media (min-width: 1400px) {
            .game-container {
                max-width: 1600px;
            }
            
            .image-item {
                width: 200px;
                height: 200px;
            }
            
            .phrase-item {
                min-height: 140px;
                padding: 25px;
            }
            
            .phrase-item p {
                font-size: 1.5rem;
            }
            
            button {
                font-size: 1.5rem;
                padding: 18px 35px;
            }
            
            .score-display {
                font-size: 1.8rem;
                padding: 15px 30px;
            }
        }
        
        /* Особенности для очень широких экранов */
        @media (min-width: 2000px) {
            .game-container {
                max-width: 1800px;
            }
            
            .image-item {
                width: 220px;
                height: 220px;
            }
            
            .phrase-item {
                min-height: 150px;
            }
            
            .phrase-item p {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

            { id: 51, name: "Gloves", image: "videos/IMG_20251128_150512_784.png", audio: "videos/J-20251128112340450Z.mp3", isPair: true,
              images: { left: "videos/IMG_20251128_150512_784.png", right: "videos/IMG_20251128_150950_624.png" } }
        ];

        // Game state variables
        let selectedImage = null;
        let selectedPhrase = null;
        let matchedPairs = [];
        let score = 0;
        let matches = 0;
        let fireworksInterval = null;

        // Audio elements
        const backgroundAudio = document.getElementById('background-audio');
        const audioToggle = document.getElementById('audio-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        const clothingAudioToggle = document.getElementById('clothing-audio-toggle');
        const clothingVolumeSlider = document.getElementById('clothing-volume-slider');
        
        // DOM elements
        const phrasesContainer = document.getElementById('phrases-container');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackImageContainer = document.getElementById('feedback-image-container');
        const feedbackText = document.getElementById('feedback-text');

        // Initialize audio
        function initAudio() {
            // Set initial volume
            backgroundAudio.volume = volumeSlider.value;
            
            // Toggle background audio play/pause
            audioToggle.addEventListener('click', function() {
                if (backgroundAudio.paused) {
                    backgroundAudio.play();
                } else {
                    backgroundAudio.pause();
                }
            });
            
            // Update background audio volume when slider changes
            volumeSlider.addEventListener('input', function() {
                backgroundAudio.volume = this.value;
            });
            
            // Handle background audio loading errors
            backgroundAudio.addEventListener('error', function() {
                console.error('Error loading background audio file');
            });
            
            // Toggle clothing audio (play random clothing audio)
            clothingAudioToggle.addEventListener('click', function() {
                const randomItem = gameData[Math.floor(Math.random() * gameData.length)];
                playClothingAudio(randomItem.audio);
            });
            
            // Update clothing audio volume when slider changes
            clothingVolumeSlider.addEventListener('input', function() {
                // This slider controls the volume for individual clothing audio
                // The volume is applied when each audio is played
            });
        }

        // Play clothing audio
        function playClothingAudio(url, callback) {
            const audio = new Audio(url);
            audio.volume = clothingVolumeSlider.value;
            
            audio.addEventListener('error', function() {
                console.error('Error loading clothing audio file:', url);
            });
            
            if (callback) {
                audio.addEventListener('ended', callback);
            }
            
            audio.play().catch(error => {
                console.error('Audio playback failed:', error);
            });
            
            return audio;
        }

        // Initialize game
        function initGame() {
            const imagesContainer = document.getElementById('images-container');
            const scoreDisplay = document.getElementById('score-display');
            
            // Clear containers
            imagesContainer.innerHTML = '';
            phrasesContainer.innerHTML = '';
            
            // Reset state
            selectedImage = null;
            selectedPhrase = null;
            matchedPairs = [];
            score = 0;
            matches = 0;
            
            // Hide phrases container
            phrasesContainer.classList.add('hidden');
            
            // Update score display
            scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
            
            // Hide completion message
            document.getElementById('completion-message').style.opacity = '0';
            
            // Hide feedback overlay
            feedbackOverlay.style.display = 'none';
            
            // Clear any existing fireworks
            if (fireworksInterval) {
                clearInterval(fireworksInterval);
                fireworksInterval = null;
            }
            
            // Images in correct order but shuffled
            const shuffledImages = [...gameData].sort(() => Math.random() - 0.5);
            
            shuffledImages.forEach((item, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'item image-item';
                imageItem.dataset.id = item.id;
                imageItem.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                
                // Add error handling for images
                img.onerror = function() {
                    console.warn(`Failed to load image: ${item.image}`);
                };
                
                imageItem.appendChild(img);
                imagesContainer.appendChild(imageItem);
                
                // Click handler for image
                imageItem.addEventListener('click', () => handleImageClick(index, item.id));
            });
        }

        // Create phrases column when image is clicked
        function createPhrasesColumn(selectedId) {
            phrasesContainer.classList.remove('hidden');
            phrasesContainer.innerHTML = '';
            
            // Phrases in random order
            const shuffledPhrases = [...gameData].sort(() => Math.random() - 0.5);
            
            shuffledPhrases.forEach((item, index) => {
                const phraseItem = document.createElement('div');
                phraseItem.className = 'item phrase-item';
                phraseItem.dataset.id = item.id;
                phraseItem.dataset.index = index;
                
                const phraseContent = document.createElement('div');
                phraseContent.className = 'phrase-content';
                
                const p = document.createElement('p');
                p.textContent = item.name;
                
                const audioIcon = document.createElement('img');
                audioIcon.src = 'videos/IMG_20251124_151845_148.png';
                audioIcon.className = 'audio-icon-small';
                audioIcon.title = 'Listen to pronunciation';
                audioIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playClothingAudio(item.audio);
                });
                
                phraseContent.appendChild(p);
                phraseContent.appendChild(audioIcon);
                phraseItem.appendChild(phraseContent);
                phrasesContainer.appendChild(phraseItem);
                
                // Click handler for phrase
                phraseItem.addEventListener('click', () => handlePhraseClick(index, item.id, selectedId));
            });
        }

        // Image click handler
        function handleImageClick(index, id) {
            // Ignore clicks if image is already matched
            if (matchedPairs.includes(id)) return;
            
            const imageItems = document.querySelectorAll('.image-item');
            const clickedItem = imageItems[index];
            
            // Deselect other images
            imageItems.forEach(item => {
                const itemId = parseInt(item.dataset.id);
                if (item !== clickedItem && !matchedPairs.includes(itemId)) {
                    item.classList.remove('selected');
                }
            });
            
            // If clicking already selected image, deselect it
            if (selectedImage === index) {
                clickedItem.classList.remove('selected');
                selectedImage = null;
                // Hide phrases column
                phrasesContainer.classList.add('hidden');
            } else {
                // Select new image
                clickedItem.classList.add('selected');
                selectedImage = index;
                
                // Create phrases column for this image
                createPhrasesColumn(id);
            }
        }

        // Phrase click handler
        function handlePhraseClick(index, phraseId, imageId) {
            // Ignore clicks if phrase is already matched
            if (matchedPairs.includes(phraseId)) return;
            
            const phraseItems = document.querySelectorAll('.phrase-item');
            const clickedItem = phraseItems[index];
            const scoreDisplay = document.getElementById('score-display');
            
            // Check if this phrase matches the selected image
            if (phraseId === imageId) {
                // Correct match
                score += 10;
                matches++;
                scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
                
                // Add to matched pairs
                matchedPairs.push(phraseId);
                
                // Get the selected image item
                const imageItems = document.querySelectorAll('.image-item');
                const selectedImageItem = Array.from(imageItems).find(item => 
                    parseInt(item.dataset.id) === imageId
                );
                
                if (selectedImageItem) {
                    selectedImageItem.classList.remove('selected');
                    selectedImageItem.classList.add('correct');
                }
                
                clickedItem.classList.remove('selected');
                clickedItem.classList.add('correct');
                
                // Get item data for feedback
                const item = gameData.find(item => item.id === phraseId);
                
                // Show correct feedback with fireworks
                showFeedback(true, item);
                
                // Start fireworks animation
                startFireworks();
                
                // After 5 seconds, make the matched elements disappear
                setTimeout(() => {
                    if (selectedImageItem) {
                        selectedImageItem.classList.add('disappear');
                    }
                    clickedItem.classList.add('disappear');
                    
                    // Stop fireworks
                    if (fireworksInterval) {
                        clearInterval(fireworksInterval);
                        fireworksInterval = null;
                    }
                    
                    // Check if game is completed
                    if (matchedPairs.length === gameData.length) {
                        setTimeout(() => {
                            document.getElementById('completion-message').style.opacity = '1';
                            // Final fireworks
                            startFireworks();
                            setTimeout(() => {
                                if (fireworksInterval) {
                                    clearInterval(fireworksInterval);
                                }
                            }, 5000);
                        }, 1000);
                    }
                }, 5000);
            } else {
                // Incorrect match
                score = Math.max(0, score - 5);
                scoreDisplay.textContent = `Score: ${score} | Matches: ${matches}/${gameData.length}`;
                
                // Get the item for feedback
                const item = gameData.find(item => item.id === phraseId);
                
                // Show incorrect feedback
                showFeedback(false, item);
                
                // Highlight incorrect
                clickedItem.classList.add('incorrect');
                
                // Reset selection after 3 seconds
                setTimeout(() => {
                    clickedItem.classList.remove('selected', 'incorrect');
                }, 3000);
            }
            
            // Reset selected elements
            selectedImage = null;
            selectedPhrase = null;
            
            // Hide phrases column after selection
            setTimeout(() => {
                phrasesContainer.classList.add('hidden');
            }, 100);
        }

        // Show feedback overlay
        function showFeedback(isCorrect, item) {
            if (!item) return;
            
            feedbackImageContainer.innerHTML = '';
            
            if (isCorrect) {
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "feedback-title correct";
                feedbackText.textContent = `${item.name} ✓`;
                feedbackText.style.color = "#00ff00";
                
                if (item.isPair) {
                    // Show both images for paired items
                    const pairedContainer = document.createElement('div');
                    pairedContainer.className = 'feedback-paired-images';
                    
                    const leftImg = document.createElement('img');
                    leftImg.src = item.images.left;
                    leftImg.alt = item.name;
                    leftImg.className = 'feedback-paired-image correct-image';
                    
                    const rightImg = document.createElement('img');
                    rightImg.src = item.images.right;
                    rightImg.alt = item.name;
                    rightImg.className = 'feedback-paired-image correct-image';
                    
                    pairedContainer.appendChild(leftImg);
                    pairedContainer.appendChild(rightImg);
                    feedbackImageContainer.appendChild(pairedContainer);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image correct-image';
                    feedbackImageContainer.appendChild(img);
                }
                
                // Play pronunciation
                playClothingAudio(item.audio);
            } else {
                feedbackTitle.textContent = "Try Again!";
                feedbackTitle.className = "feedback-title incorrect";
                feedbackText.textContent = `${item.name} ✗`;
                feedbackText.style.color = "#ff0000";
                
                if (item.isPair) {
                    // Show left image for paired items
                    const img = document.createElement('img');
                    img.src = item.images ? item.images.left : item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                } else {
                    // Show single image
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.className = 'feedback-image incorrect-image';
                    feedbackImageContainer.appendChild(img);
                }
            }
            
            feedbackOverlay.style.display = "flex";
            
            // Hide overlay after delay
            const hideDelay = isCorrect ? 5000 : 3000;
            setTimeout(() => {
                feedbackOverlay.style.display = "none";
            }, hideDelay);
        }

        // Start fireworks animation
        function startFireworks() {
            if (fireworksInterval) {
                clearInterval(fireworksInterval);
            }
            
            fireworksInterval = setInterval(createFirework, 200);
        }

        // Create a firework
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // Random position
            const left = Math.random() * window.innerWidth;
            const top = Math.random() * window.innerHeight;
            firework.style.left = `${left}px`;
            firework.style.top = `${top}px`;
            
            // Random color (orange-themed)
            const colors = ['#ff7518', '#ff8c00', '#ff9900', '#ffcc00', '#ff6600', '#ff3300'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            firework.style.backgroundColor = color;
            
            // Random size
            const size = 4 + Math.random() * 10;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            // Random box shadow for glow effect
            const glow = Math.random() * 15 + 5;
            firework.style.boxShadow = `0 0 ${glow}px ${color}`;
            
            // Add to body
            document.body.appendChild(firework);
            
            // Random animation
            const animationDuration = 1 + Math.random() * 2;
            firework.style.transition = `all ${animationDuration}s ease-out`;
            
            // Animate
            setTimeout(() => {
                firework.style.transform = `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(0)`;
                firework.style.opacity = '0';
            }, 10);
            
            // Remove after animation
            setTimeout(() => {
                if (firework.parentNode) {
                    firework.remove();
                }
            }, animationDuration * 1000);
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
            initAudio();
            
            // Handler for reset button
            document.getElementById('reset-btn').addEventListener('click', initGame);
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            // Update layout if needed
        });
    </script>
