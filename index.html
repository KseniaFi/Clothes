<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .flashcard-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            perspective: 1500px;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: hidden;
        }

        .front {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 250, 0.95) 100%);
            border: 3px solid transparent;
            box-shadow: inset 0 0 30px rgba(0, 255, 0, 0.3), 0 0 20px rgba(0, 255, 0, 0.2);
            transition: all 0.3s ease;
        }

        .front:hover {
            box-shadow: inset 0 0 40px rgba(0, 255, 0, 0.4), 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .back {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 250, 0.95) 100%);
            transform: rotateY(180deg);
            text-align: center;
        }

        .item-image-container {
            width: 100%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .item-image {
            max-width: 90%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .pair-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .pair-image {
            max-width: 45%;
            max-height: 80%;
            object-fit: contain;
        }

        .item-name-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .item-name {
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            padding: 15px 30px;
            border-radius: 12px;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 95%;
            word-wrap: break-word;
            hyphens: auto;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: break-word;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 140px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-prev {
            background: #e74c3c;
        }

        .btn-prev:hover {
            background: #c0392b;
        }

        .btn-flip {
            background: #9b59b6;
        }

        .btn-flip:hover {
            background: #8e44ad;
        }

        .btn-next {
            background: #2ecc71;
        }

        .btn-next:hover {
            background: #27ae60;
        }

        .audio-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.2));
            z-index: 100;
        }

        .audio-indicator:hover {
            transform: scale(1.1);
        }

        .audio-indicator.playing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .flashcard-container {
                height: 400px;
            }
            
            .item-name {
                font-size: 1.8rem;
                padding: 12px 20px;
                min-height: 50px;
                max-width: 90%;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
                min-width: 120px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .pair-image-container {
                gap: 10px;
            }
            
            .pair-image {
                max-width: 48%;
            }
        }

        @media (max-width: 480px) {
            .flashcard-container {
                height: 350px;
            }
            
            .item-name {
                font-size: 1.5rem;
                padding: 10px 15px;
                min-height: 45px;
                max-width: 85%;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 0.9rem;
                min-width: 100px;
            }
            
            .pair-image-container {
                gap: 8px;
            }
            
            .pair-image {
                max-width: 48%;
            }
            
            .audio-indicator {
                width: 40px;
                height: 40px;
                bottom: 15px;
                right: 15px;
            }
            
            .flashcard-face {
                padding: 20px;
            }
        }

        @media (max-width: 360px) {
            .flashcard-container {
                height: 300px;
            }
            
            .item-name {
                font-size: 1.3rem;
                padding: 8px 12px;
                min-height: 40px;
                max-width: 80%;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 90px;
            }
            
            .pair-image-container {
                gap: 5px;
            }
            
            .pair-image {
                max-width: 48%;
            }
        }

        /* Special handling for very long text */
        @media (max-width: 768px) {
            .item-name.long-text {
                font-size: 1.6rem;
                line-height: 1.2;
            }
        }

            }
        }

        @media (max-width: 360px) {
            .item-name.long-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

                const backLeftImg = document.createElement('img');
                backLeftImg.src = item.images.left;
                backLeftImg.alt = `${item.name} (left)`;
                backLeftImg.className = 'pair-image';
                backPairContainer.appendChild(backLeftImg);
                
                // Right image for back
                const backRightImg = document.createElement('img');
                backRightImg.src = item.images.right;
                backRightImg.alt = `${item.name} (right)`;
                backRightImg.className = 'pair-image';
                backPairContainer.appendChild(backRightImg);
                
                backItemImageContainer.appendChild(backPairContainer);
            } else {
                // Single image for front
                const frontImg = document.createElement('img');
                frontImg.src = item.image;
                frontImg.alt = item.name;
                frontImg.className = 'item-image';
                itemImageContainer.appendChild(frontImg);
                
                // Single image for back
                const backImg = document.createElement('img');
                backImg.src = item.image;
                backImg.alt = item.name;
                backImg.className = 'item-image';
                backItemImageContainer.appendChild(backImg);
            }
            
            // Set name and adjust class for long text
            itemName.textContent = item.name;
            
            // Check if text is long and add appropriate class
            if (item.name.length > 40) {
                itemName.classList.add('long-text');
            } else {
                itemName.classList.remove('long-text');
            }
            
            // Reset card to front if it was flipped
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
            
            // Stop any playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                audioIndicator.classList.remove('playing');
            }
            
            // Update flip button text
            flipBtn.textContent = 'Flip Card';
        }

        // Show previous item
        function showPreviousItem() {
            currentItemIndex = (currentItemIndex - 1 + clothingItems.length) % clothingItems.length;
            displayCurrentItem();
        }

        // Show next item
        function showNextItem() {
            currentItemIndex = (currentItemIndex + 1) % clothingItems.length;
            displayCurrentItem();
        }

        // Flip card
        function flipCard() {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
            
            // Update flip button text
            flipBtn.textContent = 'Flip Card';
        }

        // Play pronunciation
        function playPronunciation() {
            const item = clothingItems[currentItemIndex];
            
            // Stop previous audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            // Create and play new audio
            currentAudio = new Audio(item.audio);
            currentAudio.volume = 0.8;
            
            // Add playing indicator
            audioIndicator.classList.add('playing');
            
            currentAudio.play();
            
            // Remove playing indicator when done
            currentAudio.addEventListener('ended', () => {
                audioIndicator.classList.remove('playing');
            });
            
            currentAudio.addEventListener('error', () => {
                audioIndicator.classList.remove('playing');
                console.error('Error loading audio:', item.audio);
            });
        }

        // Replay pronunciation
        function replayPronunciation() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            playPronunciation();
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
