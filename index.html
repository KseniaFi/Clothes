<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #fff;
            cursor: default;
        }

        .header {
            text-align: center;
            margin: 20px 0 30px;
            width: 100%;
        }

        .game-title {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
            animation: titleGlow 3s infinite alternate;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #a0e7ff;
            text-shadow: 0 0 5px #0088ff;
            margin-bottom: 15px;
        }

        .audio-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        .speaker {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px #ff9900);
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px #ff9900);
        }

        .speaker.playing {
            animation: speakerPulse 1s ease-in-out infinite;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 100px;
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(90deg, #ff9900, #ffcc00);
            border-radius: 4px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff9900;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.8);
        }

        .game-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .column {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(0, 20, 40, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .column-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
            padding-bottom: 10px;
            border-bottom: 2px solid #00aaff;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .items-list::-webkit-scrollbar {
            width: 8px;
        }

        .items-list::-webkit-scrollbar-track {
            background: rgba(0, 50, 100, 0.5);
            border-radius: 10px;
        }

        .items-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00aaff, #0088ff);
            border-radius: 10px;
        }

        .text-item, .image-item {
            background: rgba(0, 40, 80, 0.7);
            border: 2px solid #0088ff;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 80px;
            position: relative;
            overflow: hidden;
        }

        .text-item {
            gap: 15px;
        }

        .text-item:hover, .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 150, 255, 0.4);
            border-color: #00ccff;
        }

        .text-item.selected, .image-item.selected {
            background: rgba(0, 100, 200, 0.5);
            border-color: #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
        }

        .text-item.correct, .image-item.correct {
            animation: correctGlow 5s forwards;
        }

        .text-item.incorrect, .image-item.incorrect {
            animation: incorrectGlow 3s;
        }

        .item-text {
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 0 0 8px #00aaff;
            text-align: center;
            flex-grow: 1;
        }

        .audio-icon {
            width: 35px;
            height: 35px;
            filter: drop-shadow(0 0 5px #ff9900);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-icon:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px #ff9900);
        }

        .item-image {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px #00aaff);
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.4);
        }

        .score-container {
            background: rgba(0, 20, 40, 0.9);
            padding: 20px 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
            margin-bottom: 20px;
        }

        .score {
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 0 0 15px #8a2be2, 0 0 25px #8a2be2, 0 0 35px #8a2be2;
            animation: scoreGlow 2s infinite alternate;
        }

        .timer {
            font-size: 1.5rem;
            color: #00ffea;
            text-shadow: 0 0 10px #00ffea;
        }

        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 30, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .feedback-content {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .feedback-title {
            font-size: 4rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px;
        }

        .feedback-title.correct {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }

        .feedback-title.incorrect {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }

        .feedback-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin: 30px 0;
            filter: drop-shadow(0 0 20px);
            animation: float 3s ease-in-out infinite;
        }

        .feedback-text {
            font-size: 2.5rem;
            margin-top: 20px;
            text-shadow: 0 0 15px;
        }

        .correct-image {
            filter: drop-shadow(0 0 20px #00ff00);
        }

        .incorrect-image {
            filter: drop-shadow(0 0 20px #ff0000);
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
            }
            100% {
                text-shadow: 0 0 15px #00ffea, 0 0 30px #00ffea, 0 0 45px #00ffea;
            }
        }

        @keyframes scoreGlow {
            0% {
                text-shadow: 0 0 15px #8a2be2, 0 0 25px #8a2be2, 0 0 35px #8a2be2;
            }
            100% {
                text-shadow: 0 0 20px #8a2be2, 0 0 35px #8a2be2, 0 0 50px #8a2be2;
            }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #ff9900);
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px #ff9900);
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px #ff9900);
            }
        }

        @keyframes correctGlow {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
                border-color: #00ff00;
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
                border-color: #00ff00;
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        @keyframes incorrectGlow {
            0% {
                background: rgba(255, 0, 0, 0.3);
                border-color: #ff0000;
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            }
            50% {
                background: rgba(255, 0, 0, 0.5);
                border-color: #ff0000;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            }
            100% {
                background: rgba(0, 40, 80, 0.7);
                border-color: #0088ff;
                box-shadow: none;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* Адаптация для планшетов */
        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .column {
                width: 90%;
                max-width: 600px;
            }
            
            .audio-controls {
                top: 10px;
                right: 10px;
                padding: 10px;
            }
            
            .game-title {
                font-size: 2.2rem;
            }
        }

        /* Адаптация для мобильных телефонов */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8rem;
                margin-top: 60px;
            }
            
            .column {
                min-width: 280px;
                padding: 15px;
            }
            
            .items-list {
                height: 400px;
            }
            
            .item-text {
                font-size: 1.1rem;
            }
            
            .audio-icon {
                width: 30px;
                height: 30px;
            }
            
            .score-container {
                padding: 15px 25px;
                flex-direction: column;
                gap: 15px;
            }
            
            .score {
                font-size: 1.8rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
            
            .feedback-title {
                font-size: 2.5rem;
            }
            
            .feedback-image {
                width: 200px;
                height: 200px;
            }
            
            .feedback-text {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 1.5rem;
            }
            
            .column-title {
                font-size: 1.4rem;
            }
            
            .text-item, .image-item {
                padding: 15px;
                min-height: 70px;
            }
            
            .item-text {
                font-size: 1rem;
            }
            
            .score {
                font-size: 1.5rem;
            }
            
            .items-list {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="audio-controls">
        <img src="https://img.icons8.com/color/96/000000/speaker.png" alt="Music" class="speaker" id="musicSpeaker">
        <div class="volume-container">
            <input type="range" min="0" max="1" step="0.1" value="0.5" class="volume-slider" id="volumeSlider">
        </div>
    </div>

    <div class="header">
        <h1 class="game-title">Clothing Match Game</h1>
        <p class="game-subtitle">Match clothing names with pictures! Click the audio icon to hear pronunciation</p>
    </div>

    <div class="score-container">
        <div class="score" id="score">Score: 0</div>
        <div class="timer" id="timer">Matches: 0/10</div>
    </div>

    <div class="game-container">
        <div class="column">
            <h2 class="column-title">Clothing Names</h2>
            <div class="items-list" id="textItems"></div>
        </div>
        
        <div class="column">
            <h2 class="column-title">Clothing Images</h2>
            <div class="items-list" id="imageItems"></div>
        </div>
    </div>

    <div class="game-controls">
        <button class="btn btn-restart" id="restartBtn">Start Over</button>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-content">
            <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
            <img src="" alt="Feedback Image" class="feedback-image" id="feedbackImage">
            <div class="feedback-text" id="feedbackText"></div>
        </div>
    </div>

    <script>
        // Clothing data
        const clothingItems = [
            {
                id: 1,
                name: "Jacket",
                image: "https://cdn-icons-png.flaticon.com/512/3050/3050275.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/jacket--_gb_1.mp3"
            },
            {
                id: 2,
                name: "T-shirt",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099523.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/t_shirt--_gb_1.mp3"
            },
            {
                id: 3,
                name: "Jeans",
                image: "https://cdn-icons-png.flaticon.com/512/3082/3082383.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/jeans--_gb_1.mp3"
            },
            {
                id: 4,
                name: "Dress",
                image: "https://cdn-icons-png.flaticon.com/512/3675/3675251.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/dress--_gb_1.mp3"
            },
            {
                id: 5,
                name: "Shoes",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099529.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/shoes--_gb_1.mp3"
            },
            {
                id: 6,
                name: "Hat",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099531.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/hat--_gb_1.mp3"
            },
            {
                id: 7,
                name: "Scarf",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099532.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/scarf--_gb_1.mp3"
            },
            {
                id: 8,
                name: "Gloves",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099528.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/gloves--_gb_1.mp3"
            },
            {
                id: 9,
                name: "Skirt",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099525.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/skirt--_gb_1.mp3"
            },
            {
                id: 10,
                name: "Socks",
                image: "https://cdn-icons-png.flaticon.com/512/3099/3099526.png",
                audio: "https://ssl.gstatic.com/dictionary/static/sounds/20200429/socks--_gb_1.mp3"
            }
        ];

        // Game state
        let score = 0;
        let matches = 0;
        let selectedTextItem = null;
        let selectedImageItem = null;
        let matchedPairs = [];
        let backgroundMusic = null;
        let fireworksInterval = null;

        // DOM elements
        const textItemsContainer = document.getElementById('textItems');
        const imageItemsContainer = document.getElementById('imageItems');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const musicSpeaker = document.getElementById('musicSpeaker');
        const volumeSlider = document.getElementById('volumeSlider');
        const restartBtn = document.getElementById('restartBtn');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackImage = document.getElementById('feedbackImage');
        const feedbackText = document.getElementById('feedbackText');

        // Initialize game
        function initGame() {
            resetGame();
            createItems();
            setupEventListeners();
            startFireworks();
        }

        // Reset game state
        function resetGame() {
            score = 0;
            matches = 0;
            selectedTextItem = null;
            selectedImageItem = null;
            matchedPairs = [];
            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Matches: ${matches}/${clothingItems.length}`;
        }

        // Create shuffled items
        function createItems() {
            textItemsContainer.innerHTML = '';
            imageItemsContainer.innerHTML = '';
            
            // Shuffle items
            const shuffledItems = [...clothingItems].sort(() => Math.random() - 0.5);
            const shuffledImages = [...clothingItems].sort(() => Math.random() - 0.5);
            
            // Create text items
            shuffledItems.forEach(item => {
                const textItem = document.createElement('div');
                textItem.className = 'text-item';
                textItem.dataset.id = item.id;
                textItem.dataset.name = item.name;
                
                const textSpan = document.createElement('span');
                textSpan.className = 'item-text';
                textSpan.textContent = item.name;
                
                const audioIcon = document.createElement('img');
                audioIcon.src = 'https://img.icons8.com/color/96/000000/audio.png';
                audioIcon.className = 'audio-icon';
                audioIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playAudio(item.audio);
                });
                
                textItem.appendChild(audioIcon);
                textItem.appendChild(textSpan);
                textItem.addEventListener('click', () => selectTextItem(textItem));
                
                textItemsContainer.appendChild(textItem);
            });
            
            // Create image items
            shuffledImages.forEach(item => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                imageItem.dataset.id = item.id;
                
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                img.className = 'item-image';
                
                imageItem.appendChild(img);
                imageItem.addEventListener('click', () => selectImageItem(imageItem));
                
                imageItemsContainer.appendChild(imageItem);
            });
        }

        // Select text item
        function selectTextItem(item) {
            if (matchedPairs.includes(item.dataset.id)) return;
            
            // Deselect previous selection
            if (selectedTextItem) {
                selectedTextItem.classList.remove('selected');
            }
            
            // Select new item
            item.classList.add('selected');
            selectedTextItem = item;
            
            // Check for match if both selected
            checkMatch();
        }

        // Select image item
        function selectImageItem(item) {
            if (matchedPairs.includes(item.dataset.id)) return;
            
            // Deselect previous selection
            if (selectedImageItem) {
                selectedImageItem.classList.remove('selected');
            }
            
            // Select new item
            item.classList.add('selected');
            selectedImageItem = item;
            
            // Check for match if both selected
            checkMatch();
        }

        // Check if selected items match
        function checkMatch() {
            if (!selectedTextItem || !selectedImageItem) return;
            
            const textId = selectedTextItem.dataset.id;
            const imageId = selectedImageItem.dataset.id;
            
            if (textId === imageId) {
                // Correct match
                score += 10;
                matches++;
                scoreDisplay.textContent = `Score: ${score}`;
                timerDisplay.textContent = `Matches: ${matches}/${clothingItems.length}`;
                
                // Add to matched pairs
                matchedPairs.push(textId);
                
                // Show correct feedback
                showFeedback(true, selectedTextItem.dataset.name, clothingItems.find(item => item.id == textId).image);
                
                // Remove items after delay
                setTimeout(() => {
                    selectedTextItem.classList.add('correct');
                    selectedImageItem.classList.add('correct');
                    
                    setTimeout(() => {
                        selectedTextItem.style.display = 'none';
                        selectedImageItem.style.display = 'none';
                        selectedTextItem = null;
                        selectedImageItem = null;
                    }, 500);
                }, 5000);
                
                // Check if game is complete
                if (matches === clothingItems.length) {
                    setTimeout(() => {
                        alert(`Congratulations! You've completed the game!\nFinal Score: ${score}`);
                    }, 1000);
                }
            } else {
                // Incorrect match
                score = Math.max(0, score - 5);
                scoreDisplay.textContent = `Score: ${score}`;
                
                // Show incorrect feedback
                showFeedback(false, selectedTextItem.dataset.name, clothingItems.find(item => item.id == imageId).image);
                
                // Highlight incorrect
                selectedTextItem.classList.add('incorrect');
                selectedImageItem.classList.add('incorrect');
                
                // Reset after delay
                setTimeout(() => {
                    selectedTextItem.classList.remove('selected', 'incorrect');
                    selectedImageItem.classList.remove('selected', 'incorrect');
                    selectedTextItem = null;
                    selectedImageItem = null;
                }, 3000);
            }
        }

        // Show feedback overlay
        function showFeedback(isCorrect, itemName, imageUrl) {
            if (isCorrect) {
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "feedback-title correct";
                feedbackImage.className = "feedback-image correct-image";
                feedbackText.textContent = `${itemName} ✓`;
                feedbackText.style.color = "#00ff00";
            } else {
                feedbackTitle.textContent = "Try Again!";
                feedbackTitle.className = "feedback-title incorrect";
                feedbackImage.className = "feedback-image incorrect-image";
                feedbackText.textContent = `${itemName} ✗`;
                feedbackText.style.color = "#ff0000";
            }
            
            feedbackImage.src = imageUrl;
            feedbackOverlay.style.display = "flex";
            
            // Hide overlay after delay
            setTimeout(() => {
                feedbackOverlay.style.display = "none";
            }, isCorrect ? 5000 : 3000);
        }

        // Play audio
        function playAudio(url) {
            const audio = new Audio(url);
            audio.volume = volumeSlider.value;
            audio.play();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Background music
            musicSpeaker.addEventListener('click', toggleBackgroundMusic);
            
            // Volume control
            volumeSlider.addEventListener('input', adjustVolume);
            
            // Restart button
            restartBtn.addEventListener('click', initGame);
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                backgroundMusic = new Audio('https://assets.mixkit.co/music/preview/mixkit-driving-ambition-32.mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                musicSpeaker.classList.add('playing');
            } else {
                if (backgroundMusic.paused) {
                    backgroundMusic.play();
                    musicSpeaker.classList.add('playing');
                } else {
                    backgroundMusic.pause();
                    musicSpeaker.classList.remove('playing');
                }
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
        }

        // Start fireworks
        function startFireworks() {
            fireworksInterval = setInterval(createFirework, 500);
        }

        // Create firework
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // Random position
            const left = Math.random() * window.innerWidth;
            const top = Math.random() * window.innerHeight;
            firework.style.left = `${left}px`;
            firework.style.top = `${top}px`;
            
            // Random color
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            firework.style.backgroundColor = color;
            
            // Random size
            const size = 3 + Math.random() * 6;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            // Add to body
            document.body.appendChild(firework);
            
            // Remove after animation
            setTimeout(() => {
                firework.remove();
            }, 1500);
        }

        // Initialize game on load
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
