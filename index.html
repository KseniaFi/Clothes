    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: url('videos/IMG_20251122_225742_260.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            color: #333;
            cursor: default;
        }

        .audio-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .speaker {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            position: relative;
        }

        .speaker:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .speaker.playing {
            animation: speakerPulse 2s ease-in-out infinite;
        }

        .volume-control {
            display: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .speaker-hint {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite, neonPulse 1.5s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .speaker-hint-second {
            position: absolute;
            top: -80px;
            left: 60%;
            transform: translateX(-50%);
            width: 35px;
            height: 35px;
            filter: drop-shadow(0 0 8px silver) drop-shadow(0 0 12px silver);
            animation: bounceArrow 2s infinite reverse, neonPulse 1.8s infinite alternate;
            display: none;
            transition: all 0.3s ease;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
        }

        .model-container {
            position: relative;
            width: 300px;
            height: 500px;
            margin: 20px auto;
        }

        .model {
            width: 100%;
            height: 100%;
            background: url('videos/IMG_20251127_125443_860.png') no-repeat center center;
            background-size: contain;
            position: relative;
            cursor: crosshair;
        }

        .clothing-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .clothing-item {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            transition: transform 0.3s;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center;
        }

        .clothing-item:hover {
            transform: scale(1.05);
        }

        .clothing-item.active {
            animation: pulseGlow 1.5s infinite;
        }

        .footwear-pair-container {
            position: absolute;
            pointer-events: none;
        }

        .footwear-item {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            transition: transform 0.3s;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center;
        }

        .footwear-item:hover {
            transform: scale(1.05);
        }

        .footwear-indicator {
            display: none !important;
        }

        .hint-arrow {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 50;
            animation: bounceArrow 2s infinite;
            display: none;
            filter: drop-shadow(0 0 10px #00ff00);
            transition: all 0.3s ease;
        }

        .wardrobe-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: url('videos/InShot_20251126_102840197.png') no-repeat center center;
            background-size: contain;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 250px;
        }

        .current-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .item-image {
            width: 150px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 10px 0;
            transition: all 0.3s;
            position: relative;
        }

        .item-image.active {
            animation: pulseGlow 1.5s infinite;
            transform: scale(1.1);
        }

        .footwear-image {
            background-size: 45%, 45%;
            background-position: 25% center, 75% center;
        }

        .socks-image {
            background-size: 45%, 45%;
            background-position: 25% center, 75% center;
        }

        .hands-image {
            background-size: 45%, 45%;
            background-position: 25% center, 75% center;
        }

        .item-name {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 5px 15px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            text-shadow: 2px 2px 0 #d35400, -1px -1px 0 #d35400, 1px -1px 0 #d35400, -1px 1px 0 #d35400;
            animation: fadeIn 0.5s;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-remove {
            background: #e74c3c;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .side-controls {
            display: none;
            gap: 10px;
            margin-top: 10px;
        }

        .side-controls.show {
            display: flex;
        }

        .side-btn {
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #9b59b6;
            color: white;
            transition: all 0.3s;
        }

        .side-btn:hover {
            background: #8e44ad;
        }

        .side-btn.active {
            background: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes flyToModel {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2) translateY(-20px); opacity: 0.7; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
            50% { 
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00);
            }
            100% { 
                filter: drop-shadow(0 0 5px #00ff00);
            }
        }

        @keyframes bounceArrow {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-20px); 
            }
        }

        @keyframes neonPulse {
            from {
                filter: drop-shadow(0 0 5px silver) drop-shadow(0 0 10px silver);
            }
            to {
                filter: drop-shadow(0 0 10px silver) drop-shadow(0 0 20px silver) drop-shadow(0 0 30px silver);
            }
        }

        @keyframes speakerPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            }
        }

        /* Responsive design for mobile devices */
        @media (max-width: 768px) {
            .model-container {
                width: 250px;
                height: 400px;
            }
            
            .item-name {
                font-size: 20px;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 16px;
            }
            
            .speaker {
                width: 50px;
                height: 50px;
            }
            
            .wardrobe-container {
                min-height: 200px;
            }
            
            .side-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .model-container {
                width: 200px;
                height: 350px;
            }
            
            .item-name {
                font-size: 18px;
            }
            
            .wardrobe-container {
                padding: 10px;
                min-height: 180px;
            }
            
            .item-image {
                width: 120px;
                height: 120px;
            }
            
            .hint-arrow {
                width: 60px;
                height: 60px;
            }
            
            .side-btn {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>

                position: { width: "20%" },

                isPair: true

        // State variables
        let currentItemIndex = 0;
        let wornItems = [];
        let backgroundMusic = null;
        let pronunciationAudio = null;
        let nameTimeout = null;
        let isPlacingMode = false;
        let currentFootwearSide = 'left';
        let isDragging = false;
        let dragItem = null;
        let dragOffset = { x: 0, y: 0 };
        let showSpeakerHint = true;

        // DOM elements
        const model = document.getElementById('model');
        const currentItemImage = document.getElementById('currentItemImage');
        const currentItemName = document.getElementById('currentItemName');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const removeBtn = document.getElementById('removeBtn');
        const speaker = document.getElementById('speaker');
        const speakerHint = document.getElementById('speakerHint');
        const speakerHintSecond = document.getElementById('speakerHintSecond');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const hintArrow = document.getElementById('hintArrow');
        const footwearIndicator = document.getElementById('footwearIndicator');
        const sideControls = document.getElementById('sideControls');
        const leftSideBtn = document.getElementById('leftSideBtn');
        const rightSideBtn = document.getElementById('rightSideBtn');

        // Initialize
        function init() {
            displayCurrentItem();
            
            // Event handlers
            prevBtn.addEventListener('click', showPreviousItem);
            nextBtn.addEventListener('click', showNextItem);
            removeBtn.addEventListener('click', removeAllItems);
            speaker.addEventListener('click', toggleBackgroundMusic);
            volumeSlider.addEventListener('input', adjustVolume);
            document.addEventListener('click', handleDocumentClick);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
            
            // Side controls
            leftSideBtn.addEventListener('click', () => selectSide('left'));
            rightSideBtn.addEventListener('click', () => selectSide('right'));
            
            // Show speaker hints
            if (showSpeakerHint) {
                speakerHint.style.display = 'block';
                speakerHintSecond.style.display = 'block';
                setTimeout(() => {
                    speakerHint.style.display = 'none';
                    speakerHintSecond.style.display = 'none';
                    showSpeakerHint = false;
                }, 5000);
            }
            
            // Start placement mode for first item
            startPlacementMode();
        }

        // Select side for footwear/socks/hands
        function selectSide(side) {
            currentFootwearSide = side;
            
            // Update button states
            leftSideBtn.classList.toggle('active', side === 'left');
            rightSideBtn.classList.toggle('active', side === 'right');
        }

        // Show current clothing item
        function displayCurrentItem() {
            const item = clothingItems[currentItemIndex];
            
            // Set image
            if (item.isPair) {
                currentItemImage.style.backgroundImage = `url('${item.images.left}'), url('${item.images.right}')`;
                if (item.type === "feet") {
                    currentItemImage.classList.add('footwear-image');
                    currentItemImage.classList.remove('socks-image', 'hands-image');
                } else if (item.type === "hands") {
                    currentItemImage.classList.add('hands-image');
                    currentItemImage.classList.remove('footwear-image', 'socks-image');
                } else {
                    currentItemImage.classList.add('socks-image');
                    currentItemImage.classList.remove('footwear-image', 'hands-image');
                }
            } else {
                currentItemImage.style.backgroundImage = `url('${item.image}')`;
                currentItemImage.classList.remove('footwear-image', 'socks-image', 'hands-image');
            }
            
            // Show name with animation
            currentItemName.textContent = item.name;
            currentItemName.style.display = 'block';
            
            // Show/hide side controls
            if (item.isPair) {
                sideControls.classList.add('show');
                // Set initial side
                selectSide('left');
            } else {
                sideControls.classList.remove('show');
            }
            
            // Play pronunciation with higher volume
            playPronunciation(item.audio);
            
            // Hide name after 5 seconds
            clearTimeout(nameTimeout);
            nameTimeout = setTimeout(() => {
                currentItemName.style.display = 'none';
            }, 5000);
        }

        // Show previous item
        function showPreviousItem() {
            currentItemIndex = (currentItemIndex - 1 + clothingItems.length) % clothingItems.length;
            displayCurrentItem();
            exitPlacementMode();
        }

        // Show next item
        function showNextItem() {
            currentItemIndex = (currentItemIndex + 1) % clothingItems.length;
            displayCurrentItem();
            exitPlacementMode();
        }

        // Start placement mode
        function startPlacementMode() {
            isPlacingMode = true;
            
            // Add active class to current item
            currentItemImage.classList.add('active');
            
            // Show hint arrow - positioned higher and more to the right
            hintArrow.style.top = "30%";
            hintArrow.style.left = "70%";
            hintArrow.style.transform = "translate(-50%, -50%)";
            hintArrow.style.display = 'block';
        }

        // Exit placement mode
        function exitPlacementMode() {
            isPlacingMode = false;
            currentItemImage.classList.remove('active');
            hintArrow.style.display = 'none';
        }

        // Handle document click
        function handleDocumentClick(event) {
            // Check if we're in placement mode and not clicking on UI elements
            if (!isPlacingMode || 
                event.target.closest('.audio-control') || 
                event.target.closest('.wardrobe-container') ||
                event.target.closest('.controls') ||
                event.target.closest('.side-controls')) {
                return;
            }
            
            // Place the current item at the click position
            placeClothingAtPosition(event.clientX, event.clientY);
        }

        // Handle mouse move
        function handleMouseMove(event) {
            // Handle dragging
            if (isDragging && dragItem) {
                const modelRect = model.getBoundingClientRect();
                const relativeX = event.clientX - modelRect.left - dragOffset.x;
                const relativeY = event.clientY - modelRect.top - dragOffset.y;
                
                // Calculate percentages for positioning
                const percentX = (relativeX / modelRect.width) * 100;
                const percentY = (relativeY / modelRect.height) * 100;
                
                // Update item position
                dragItem.style.left = `${percentX}%`;
                dragItem.style.top = `${percentY}%`;
            }
        }

        // Handle mouse up
        function handleMouseUp() {
            if (isDragging) {
                isDragging = false;
                if (dragItem) {
                    dragItem.style.cursor = 'move';
                    dragItem = null;
                }
            }
        }

        // Place clothing at specific position
        function placeClothingAtPosition(x, y) {
            const item = clothingItems[currentItemIndex];
            
            // Calculate position relative to model container
            const modelRect = model.getBoundingClientRect();
            const relativeX = x - modelRect.left;
            const relativeY = y - modelRect.top;
            
            // Calculate percentages for positioning
            const percentX = (relativeX / modelRect.width) * 100;
            const percentY = (relativeY / modelRect.height) * 100;
            
            // For footwear, socks, and hands pairs, place individual items
            if (item.isPair) {
                // Remove any existing instance of this item for the current side
                removeIndividualItem(currentItemIndex, currentFootwearSide);
                
                // Place the current side
                wearIndividualItem(currentItemIndex, percentX, percentY, currentFootwearSide);
            } else {
                // Remove any existing instance of this item
                removeItem(currentItemIndex);
                
                // Wear the item at the calculated position
                wearItem(currentItemIndex, percentX, percentY);
            }
        }

        // Wear individual item from a pair (footwear, socks, or hands)
        function wearIndividualItem(index, xPercent, yPercent, side) {
            const item = clothingItems[index];
            
            // Create clothing element for individual item
            const clothingElement = document.createElement('div');
            clothingElement.className = item.type === 'hands' ? 'clothing-item' : 'footwear-item';
            clothingElement.style.backgroundImage = `url('${item.images[side]}')`;
            clothingElement.style.backgroundSize = 'contain';
            clothingElement.style.backgroundRepeat = 'no-repeat';
            clothingElement.style.backgroundPosition = 'center';
            
            // Set positioning based on click
            clothingElement.style.top = `${yPercent}%`;
            clothingElement.style.left = `${xPercent}%`;
            clothingElement.style.transform = 'translate(-50%, -50%)';
            clothingElement.style.width = item.position.width;
            clothingElement.style.height = 'auto';
            clothingElement.style.aspectRatio = '1/1';
            
            // Add event listeners for dragging
            addItemInteractions(clothingElement, index, side);
            
            // Add to model
            model.appendChild(clothingElement);
            
            // Add to worn items list
            wornItems.push({
                index: index,
                element: clothingElement,
                side: side
            });
            
            // Add animation
            clothingElement.style.animation = 'flyToModel 1s forwards';
        }

        // Wear item on model at specific position
        function wearItem(index, xPercent = null, yPercent = null) {
            const item = clothingItems[index];
            
            // Create clothing element
            const clothingElement = document.createElement('div');
            clothingElement.className = 'clothing-item';
            clothingElement.style.backgroundImage = `url('${item.image}')`;
            clothingElement.style.backgroundSize = 'contain';
            clothingElement.style.backgroundRepeat = 'no-repeat';
            clothingElement.style.backgroundPosition = 'center';
            
            // Set positioning - use clicked position or default position
            if (xPercent !== null && yPercent !== null) {
                clothingElement.style.top = `${yPercent}%`;
                clothingElement.style.left = `${xPercent}%`;
                clothingElement.style.transform = 'translate(-50%, -50%)';
                clothingElement.style.width = item.position.width;
                clothingElement.style.height = 'auto';
                clothingElement.style.aspectRatio = '1/1';
            }
            
            // Add event listeners for dragging
            addItemInteractions(clothingElement, index);
            
            // Add to model
            model.appendChild(clothingElement);
            
            // Add to worn items list
            wornItems.push({
                index: index,
                element: clothingElement
            });
            
            // Add animation
            clothingElement.style.animation = 'flyToModel 1s forwards';
        }

        // Add interactions to clothing item (dragging)
        function addItemInteractions(element, index, side = null) {
            // Mouse down event for dragging
            element.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                startDragging(element, e);
            });
            
            // Mouse enter/leave for visual feedback
            element.addEventListener('mouseenter', () => {
                element.style.cursor = 'move';
            });
            
            element.addEventListener('mouseleave', () => {
                if (!isDragging) {
                    element.style.cursor = 'move';
                }
            });
        }

        // Start dragging an item
        function startDragging(element, event) {
            isDragging = true;
            dragItem = element;
            
            const modelRect = model.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            
            // Calculate drag offset
            dragOffset.x = event.clientX - elementRect.left + (elementRect.width / 2) - modelRect.left;
            dragOffset.y = event.clientY - elementRect.top + (elementRect.height / 2) - modelRect.top;
            
            element.style.cursor = 'grabbing';
        }

        // Remove all items
        function removeAllItems() {
            // Remove all clothing elements from model
            const clothingElements = model.querySelectorAll('.clothing-item, .footwear-item');
            clothingElements.forEach(element => {
                element.remove();
            });
            
            // Clear worn items list
            wornItems = [];
        }

        // Remove specific item from model
        function removeItem(index) {
            // Find and remove all elements for this item index
            wornItems = wornItems.filter(item => {
                if (item.index === index && !item.side) {
                    item.element.remove();
                    return false;
                }
                return true;
            });
        }

        // Remove individual item from a pair
        function removeIndividualItem(index, side) {
            // Find and remove the specific element for this item index and side
            wornItems = wornItems.filter(item => {
                if (item.index === index && item.side === side) {
                    item.element.remove();
                    return false;
                }
                return true;
            });
        }

        // Play pronunciation with higher volume
        function playPronunciation(audioUrl) {
            // Stop previous pronunciation if playing
            if (pronunciationAudio) {
                pronunciationAudio.pause();
                pronunciationAudio.currentTime = 0;
            }
            
            // Create new audio element with higher volume
            pronunciationAudio = new Audio(audioUrl);
            pronunciationAudio.volume = Math.min(volumeSlider.value * 1.5, 1.0); // 50% louder than background music
            
            // Show placement mode after audio ends
            pronunciationAudio.addEventListener('ended', () => {
                startPlacementMode();
            });
            
            pronunciationAudio.play();
        }

        // Toggle background music
        function toggleBackgroundMusic() {
            if (!backgroundMusic) {
                // Create and play background music
                backgroundMusic = new Audio('videos/Untitled (24).mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = volumeSlider.value;
                backgroundMusic.play();
                
                // Add playing class to speaker for animation
                speaker.classList.add('playing');
                
                // Show volume control
                volumeControl.classList.add('show');
            } else {
                // Stop music
                backgroundMusic.pause();
                backgroundMusic = null;
                
                // Remove playing class from speaker
                speaker.classList.remove('playing');
                
                // Hide volume control
                volumeControl.classList.remove('show');
            }
        }

        // Adjust volume
        function adjustVolume() {
            const volume = volumeSlider.value;
            
            if (backgroundMusic) {
                backgroundMusic.volume = volume;
            }
            
            // Pronunciation audio volume is set when playing, not here
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', init);
    </script>
